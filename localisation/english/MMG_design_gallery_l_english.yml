 MMG_gallery_502_t: "Early Asian Theater: Interwar Chassis"
 MMG_gallery_502_d: "This design uses an interwar medium-tank chassis to stack breakthrough during the early Asian campaign. It has 4 km/h speed, 20 armor, 39.6 breakthrough, 76.4% reliability, and 6.44 production cost, making it a practical transitional armored design for early mass production.\nFull design: Complete early-Asian-theater interwar medium-chassis design."
 MMG_gallery_503_t: "Medium Tank: Early 1939 Mainstay (1/2)"
 MMG_gallery_503_d: "The 1939 medium cannon is weak, so use a 1939 howitzer tank or SPG early. Keep armor at level 5 or lower to avoid extra steel cost, and add engine upgrades to maintain 4 km/h. Easy Maintenance, unlocked by 1939 Maintenance Company research, is the best cost-saving module.\nFull design: Complete 1939 medium-howitzer main tank."
 MMG_gallery_5032_t: "Medium Tank: Early 1939 Mainstay (2/2)"
 MMG_gallery_5032_d: "The 1939 medium cannon is weak, so use a 1939 howitzer tank or SPG early. Keep armor at level 5 or lower to avoid extra steel cost, and add engine upgrades to maintain 4 km/h. Easy Maintenance, unlocked by 1939 Maintenance Company research, is the best cost-saving module.\nSupplement: Infantry-tank MIO speed modifier. This image explains a UI location or comparison; it is not another complete finished design."
 MMG_gallery_504_t: "Light SPG Designs (1/2)"
 MMG_gallery_504_d: "This topic presents two light-SPG designs. Light SPGs have little breakthrough but provide high soft attack at low cost. The second costs about 8 for 50 soft attack and can add heavy machine guns. Medium SPGs are stronger overall but are outside this topic's scope.\nFull design: Light SPG design 1: low breakthrough, low cost, high soft attack."
 MMG_gallery_5042_t: "Light SPG Designs (2/2)"
 MMG_gallery_5042_d: "This topic presents two light-SPG designs. Light SPGs have little breakthrough but provide high soft attack at low cost. The second costs about 8 for 50 soft attack and can add heavy machine guns. Medium SPGs are stronger overall but are outside this topic's scope.\nFull design: Light SPG design 2: about 8 cost, 50 soft attack, with extra heavy machine guns."
 MMG_gallery_505_t: "Tank Destroyer (TD) (1/3)"
 MMG_gallery_505_d: "The finished TD uses the 1943 advanced high-velocity cannon for exceptional piercing and hard attack; mounting it on a medium chassis requires a fixed superstructure. The other two cannon configurations still use the Medium Tank role and must be converted to TD with the role button.\nFull design: Complete advanced high-velocity-cannon TD: high piercing and hard attack, fixed superstructure."
 MMG_gallery_5052_t: "Tank Destroyer (TD) (2/3)"
 MMG_gallery_5052_d: "The finished TD uses the 1943 advanced high-velocity cannon for exceptional piercing and hard attack; mounting it on a medium chassis requires a fixed superstructure. The other two cannon configurations still use the Medium Tank role and must be converted to TD with the role button.\nConversion reference: Improved-cannon medium-tank reference; use the role button to convert it to a TD. The displayed role is the pre-conversion vehicle, not a finished TD; change the design role as described."
 MMG_gallery_5053_t: "Tank Destroyer (TD) (3/3)"
 MMG_gallery_5053_d: "The finished TD uses the 1943 advanced high-velocity cannon for exceptional piercing and hard attack; mounting it on a medium chassis requires a fixed superstructure. The other two cannon configurations still use the Medium Tank role and must be converted to TD with the role button.\nConversion reference: Improved high-velocity-cannon medium-tank reference; its current role is still Medium Tank. The displayed role is the pre-conversion vehicle, not a finished TD; change the design role as described."
 MMG_gallery_506_t: "Flame Tanks and Armored Support Vehicles (1/2)"
 MMG_gallery_506_d: "After Ground Warfare research unlocks armored support vehicles, skip the free 13.8-cost model. Produce the auto-retired 12-cost model and combine it with MIO cost reductions. For flame tanks, use a medium flame chassis and level-2 flamethrower; fuel drums extend the division's fuel endurance.\nFull design: Complete medium flame-tank design."
 MMG_gallery_5062_t: "Flame Tanks and Armored Support Vehicles (2/2)"
 MMG_gallery_5062_d: "After Ground Warfare research unlocks armored support vehicles, skip the free 13.8-cost model. Produce the auto-retired 12-cost model and combine it with MIO cost reductions. For flame tanks, use a medium flame chassis and level-2 flamethrower; fuel drums extend the division's fuel endurance.\nSupplement: Armored support vehicle list: choose the auto-retired 12-cost model. This image explains a UI location or comparison; it is not another complete finished design."
 MMG_gallery_507_t: "Mechanized IFVs and Armored Recon Vehicles (1/3)"
 MMG_gallery_507_d: "The mechanized IFV is required for mechanized infantry: use the 5-cost, 2-reliability, 125-XP design. Mechanized infantry outclasses infantry but consumes steel and rubber; level 1 is enough. Armored recon vehicles serve recon and dummy-template training, so keep them cheap and reliable.\nFull design: Mechanized-infantry prerequisite IFV: 5 cost and 2 reliability."
