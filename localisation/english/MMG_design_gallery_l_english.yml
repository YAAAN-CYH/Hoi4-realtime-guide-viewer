 MMG_gallery_501_t: "Tank Design Basics: Choose the Role First (1/3)"
 MMG_gallery_501_d: "The role button determines the vehicle type: cannons can become TDs, close-support guns or howitzers can become SPGs, AA weapons can become SPAA, and flamethrowers can become flame tanks. This topic shows the button and role-selection process rather than an additional finished tank design.\nSupplement: Role button: selects tank, SPG, TD, SPAA, or flame-tank role. This image explains a UI location or comparison; it is not another complete finished design."
