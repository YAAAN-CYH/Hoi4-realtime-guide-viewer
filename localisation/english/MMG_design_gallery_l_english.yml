 MMG_gallery_701_t: "Carriers and Main Fleet Composition (1/2)"
 MMG_gallery_701_d: "A 1936 carrier filled with hangars is the standard design. Carriers need capital-ship screening to sortie effectively; use no more carriers than battleships and battlecruisers. A typical fleet is 4 carriers, 4 battleships, 8 light cruisers, and 20 destroyers.\nFull design: Complete 1936 carrier with maximum hangars."
 MMG_gallery_7012_t: "Carriers and Main Fleet Composition (2/2)"
 MMG_gallery_7012_d: "A 1936 carrier filled with hangars is the standard design. Carriers need capital-ship screening to sortie effectively; use no more carriers than battleships and battlecruisers. A typical fleet is 4 carriers, 4 battleships, 8 light cruisers, and 20 destroyers.\nFull design: Complete damage-soaking battleship for carrier screening."
 MMG_gallery_702_t: "Battleship / Battlecruiser (1/2)"
 MMG_gallery_702_d: "Battleships and battlecruisers differ mainly in armor: battleships are tougher and slower, while battlecruisers are faster and more fragile. Secondary-heavy battleships are cheaper; heavy-gun builds are stronger but costly. Tank battleships absorb damage for carriers.\nFull design: Complete battleship design."
 MMG_gallery_7022_t: "Battleship / Battlecruiser (2/2)"
 MMG_gallery_7022_d: "Battleships and battlecruisers differ mainly in armor: battleships are tougher and slower, while battlecruisers are faster and more fragile. Secondary-heavy battleships are cheaper; heavy-gun builds are stronger but costly. Tank battleships absorb damage for carriers.\nSupplement: Battleship and battlecruiser armor comparison. This image explains a UI location or comparison; it is not another complete finished design."
 MMG_gallery_703_t: "Light Cruisers and Main Screens (1/2)"
 MMG_gallery_703_d: "Place 2-3 scout light cruisers in a separate patrol set to Never Engage; they find enemies rather than fight. Main-fleet light cruisers destroy enemy screens and can use advanced fire control. Heavy cruisers are viable but harder to use.\nFull design: Complete Never Engage scout light cruiser."
 MMG_gallery_7032_t: "Light Cruisers and Main Screens (2/2)"
 MMG_gallery_7032_d: "Place 2-3 scout light cruisers in a separate patrol set to Never Engage; they find enemies rather than fight. Main-fleet light cruisers destroy enemy screens and can use advanced fire control. Heavy cruisers are viable but harder to use.\nFull design: Complete main-fleet light cruiser for destroying screens."
 MMG_gallery_704_t: "Destroyers (1/2)"
 MMG_gallery_704_d: "Cheap screening destroyers absorb frontline damage and maintain screening efficiency so capital ships and carriers can keep firing. Torpedo destroyers suit a green-water strategy: after light cruisers clear enemy screens, massed torpedoes finish the capital ships behind them.\nFull design: Complete damage-soaking destroyer for screening efficiency."
 MMG_gallery_7042_t: "Destroyers (2/2)"
 MMG_gallery_7042_d: "Cheap screening destroyers absorb frontline damage and maintain screening efficiency so capital ships and carriers can keep firing. Torpedo destroyers suit a green-water strategy: after light cruisers clear enemy screens, massed torpedoes finish the capital ships behind them.\nFull design: Complete green-water torpedo destroyer."
 MMG_gallery_705_t: "Submarines and Anti-Submarine Warfare (1/2)"
 MMG_gallery_705_d: "This topic presents ASW configurations rather than submarine designs. For submarines, use at least a 1940 hull, maximize torpedoes, minimize visibility, avoid shallow seas, and deploy enough boats. For ASW, prefer carrier torpedo bombers or naval bombers; ASW destroyers come second.\nRelated configuration: ASW configuration 1 for protecting fleets and sea lanes; not a submarine design."
 MMG_gallery_7052_t: "Submarines and Anti-Submarine Warfare (2/2)"
 MMG_gallery_7052_d: "This topic presents ASW configurations rather than submarine designs. For submarines, use at least a 1940 hull, maximize torpedoes, minimize visibility, avoid shallow seas, and deploy enough boats. For ASW, prefer carrier torpedo bombers or naval bombers; ASW destroyers come second.\nRelated configuration: ASW configuration 2; prefer carrier torpedo or naval bombers over ASW destroyers."
 MMG_gallery_706_t: "Carrier Aircraft (1/2)"
 MMG_gallery_706_d: "Carrier designs fall into torpedo/naval bombers and dive/CAS bombers. Torpedo aircraft attack capital ships and submarines; multirole torpedo bombers with heavy machine guns are stronger, while carrier CAS is weaker. A carrier can use only multirole torpedo bombers.\nFull design: Multirole carrier torpedo/naval bomber for capital ships and submarines."
 MMG_gallery_7062_t: "Carrier Aircraft (2/2)"
 MMG_gallery_7062_d: "Carrier designs fall into torpedo/naval bombers and dive/CAS bombers. Torpedo aircraft attack capital ships and submarines; multirole torpedo bombers with heavy machine guns are stronger, while carrier CAS is weaker. A carrier can use only multirole torpedo bombers.\nFull design: Carrier dive/CAS bomber, generally weaker than the multirole torpedo bomber."
