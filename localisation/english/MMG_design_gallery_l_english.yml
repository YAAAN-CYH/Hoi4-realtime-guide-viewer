 MMG_gallery_5072_d: "The mechanized IFV is required for mechanized infantry: use the 5-cost, 2-reliability, 125-XP design. Mechanized infantry outclasses infantry but consumes steel and rubber; level 1 is enough. Armored recon vehicles serve recon and dummy-template training, so keep them cheap and reliable.\nFull design: Low-cost armored recon vehicle for dummy-template training."
 MMG_gallery_5073_t: "Mechanized IFVs and Armored Recon Vehicles (3/3)"
 MMG_gallery_5073_d: "The mechanized IFV is required for mechanized infantry: use the 5-cost, 2-reliability, 125-XP design. Mechanized infantry outclasses infantry but consumes steel and rubber; level 1 is enough. Armored recon vehicles serve recon and dummy-template training, so keep them cheap and reliable.\nFull design: Armored recon vehicle for normal combat divisions."
 MMG_gallery_601_t: "Multirole Fighter (Recommended Mainstay) (1/3)"
 MMG_gallery_601_d: "A multirole is essentially a fighter assigned to CAS. At 145-165% CAS efficiency, a multirole with two heavy machine guns outdamages a pure fighter with three. Fly it only where ground combat is active; ground AA can shoot it down easily.\nFull design: Early multirole design before rocket rails."
