 MMG_gallery_602_t: "Pure Fighter / Interceptor"
 MMG_gallery_602_d: "Pure fighters suit straits and homeland defense. Armor plates and self-sealing fuel tanks act as aircraft HP; add at least one extra fuel tank. If both defensive modules cannot fit, choose by situation. Air weapon priority: level-2 cannon > heavy machine gun > everything else.\nFull design: Complete pure fighter for homeland defense and interception."
 MMG_gallery_603_t: "Close Air Support (CAS)"
 MMG_gallery_603_d: "CAS bombs after air superiority is secured. Stack range and damage; defense matters little. Air doctrine, advisors, and Close Air Support efficiency all multiply CAS output.\nFull design: Complete CAS design: stack range and ground attack after securing air superiority."
 MMG_gallery_604_t: "Modules and Year-by-Year Progression (1/5)"
 MMG_gallery_604_d: "Rocket rails do not reduce speed and are standard on midwar multiroles. With identical modules, putting the ground weapon first lets a CAS multirole receive both CAS and fighter cost reductions. The final 1944 slot only accepts ground weapons, and level-2 cannons are the best late air weapon. The last page only locates rocket-rail technology.\nFull design: Identical-module comparison 1: ground weapon is not in the first slot."
