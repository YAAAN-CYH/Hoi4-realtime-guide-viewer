 MMG_tank1194_index_t: "1.19.4 Tank Designs: Chassis Index"
 MMG_tank1194_index_d: "Choose a chassis generation, then inspect the full design, modules or stats. These are all-tech reference values; research, designers and bonuses change actual results. Armor 0 means no armor upgrades, not zero armor thickness."
 MMG_tank1194_version_t: "1.19.4: Version and Technology Notes"
 MMG_tank1194_version_d: "Artillery and TD bonuses were reduced. Reassess small cannons; heavy and light MGs can supplement attack. Autoloaders add 2% soft attack and 2% air attack, not flat attack values.\nAll-tech examples can use equipment unlocked much later than their chassis. Match modules to current research. Displayed roles and values take precedence; descriptions have been corrected accordingly."
 MMG_tank1194_principles_t: "1.19.4: Roles and Production Priorities"
 MMG_tank1194_principles_d: "Compare armor-0 combat mediums first when cost matters. Armor advantages depend on enemy piercing and division-level stats.\nPrioritize dozer blades for entrenched defensive TDs. Difficult-AI defensive TDs have low priority for normal offensives.\nAdvanced light designs are absent. The armor-0 improved TD and modern TD conversion have advice only, without invented panels or exact stats."
