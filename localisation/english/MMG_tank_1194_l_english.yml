 MMG_tank1194_design_01_label: "Interwar Light: 1942 TD"
 MMG_tank1194_design_01_full_t: "Interwar Light: 1942 TD (1/4)"
 MMG_tank1194_design_01_full_d: "Fixed superstructure, 1942 medium cannon, heavy and light MGs, easy maintenance, dozer blade, wheeled suspension; engine 0, armor 0.\nFor entrenched defense against difficult AI. Spare ammunition can trade reliability for defense; low priority for normal offensives.\nSpeed 4.8; reliability 70.0%; soft attack 20.5; hard attack 38.2; production cost 7.80."
