 MMG_tank1194_design_32_label: "Other Chassis: Land Cruiser"
 MMG_tank1194_design_32_full_t: "Other Chassis: Land Cruiser (1/3)"
 MMG_tank1194_design_32_full_d: "Heavy/medium naval guns, two coaxial high-velocity guns, two coaxial medium guns, wet ammo storage, command center and bunker device; engine 9.\nKeep speed at 4. Consider it for difficult defensive games; poor offensive terrain performance needs flame and parachute support.\nReliability 64.0%; soft attack 226.0; hard attack 237.0; production cost 406.90."
