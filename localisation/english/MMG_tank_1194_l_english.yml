 MMG_tank1194_design_02_full_t: "Interwar Light: SPG (2/4)"
 MMG_tank1194_design_02_full_d: "Fixed superstructure, 1942 medium howitzer, one heavy MG, two light MGs, easy maintenance, wheeled suspension; engine 4, armor 0.\nA low-cost soft-attack design. A heavy MG adds only about 1.8 soft attack in this SPG role; compare its gain with its cost.\nSpeed 4.0; reliability 86.9%; soft attack 58.1; breakthrough 0.0; production cost 8.06."
