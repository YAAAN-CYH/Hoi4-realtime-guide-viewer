 MMG_tank1194_design_34_label: "Modern Chassis: Armor-0 SPG"
 MMG_tank1194_design_34_full_t: "Modern Chassis: Armor-0 SPG (3/3)"
 MMG_tank1194_design_34_full_d: "Modern turret, heavy howitzer, autoloader, radio, easy maintenance, dozer blade, bogie suspension and gasoline; engine 0, armor 0.\nThis example uses gasoline. Maximum armor adds little breakthrough, so this version keeps armor upgrades at 0.\nSpeed 8.0; reliability 97.5%; soft attack 80.6; breakthrough 9.8; production cost 20.25."
