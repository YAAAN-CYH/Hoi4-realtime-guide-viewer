 MMG_tank1194_design_33_label: "Modern Chassis: Tank / TD Conversion"
 MMG_tank1194_design_33_full_t: "Modern Chassis: Tank / TD Conversion (2/3)"
 MMG_tank1194_design_33_full_d: "Modern turret, 1943 high-velocity cannon, autoloader, stabilizer, easy maintenance, radio, torsion bars and diesel; engine 0, armor 20.\nThe panel is a modern tank. A TD can reuse its modules after a role change; recheck stats. For SPAA, prefer a basic medium to avoid modern-chassis costs.\nReliability 103.2%; armor 115.0; breakthrough 96.6; production cost 24.75."
