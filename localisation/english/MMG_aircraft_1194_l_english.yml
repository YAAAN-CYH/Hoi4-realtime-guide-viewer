 MMG_air1194_index_t: "Aircraft Designs: 1.19.4"
 MMG_air1194_index_d: "Choose 36 designs by airframe generation. Each has full, module and stat/cost views. Airframe year does not unlock every module; research, missions, doctrines and national bonuses affect results."
 MMG_air1194_note_2_label: "Multirole Aircraft, Missions and Efficiency"
 MMG_air1194_note_2_t: "Multirole Aircraft, Missions and Efficiency"
 MMG_air1194_note_2_d: "Multirole describes a use, not a separate aircraft class. Air weapons combined with bombs, rockets or torpedoes can support multiple missions. The first weapon slot determines the design role.\nBattlefield Support and Continuous Strike can improve CAS efficiency. The cited 145-150% is conditional, not universal. Higher efficiency does not directly multiply ground attack; check the selected mission."
 MMG_air1194_note_3_label: "Module Counts and Research Requirements"
 MMG_air1194_note_3_t: "Module Counts and Research Requirements"
 MMG_air1194_note_3_d: "2 x [4x Machine Gun] means two modules and eight guns; the same rule applies to twin cannons. Enlargements preserve the actual weapon and special-module slots, including empty slots.\nCannon I is a 1939 technology; Anti-Tank Cannon II unlocks with 1940 anti-tank research. Jet engines, axial jets and advanced airframes need their own research or projects. Airframe year does not date every module."
 MMG_air1194_note_4_label: "Range, Protection and Carrier Operations"
 MMG_air1194_note_4_t: "Range, Protection and Carrier Operations"
 MMG_air1194_note_4_d: "Extra fuel tanks and drop tanks extend range; armor plates and self-sealing tanks add air defense. Balance weight, thrust and cost for the operating area.\nCarrier designs serve fleet missions, while land-based use still needs adequate range. Check armor-piercing bombs, torpedoes and dive brakes under the relevant naval-strike mission, not only the default stats."
 MMG_air1194_note_5_label: "Reconnaissance, Intel and Production Discounts"
 MMG_air1194_note_5_t: "Reconnaissance, Intel and Production Discounts"
 MMG_air1194_note_5_d: "Recon aircraft provide army intel. The cited 20% intel and roughly 6% ground-combat advantage depend on enemy reconnaissance, the intel gap and caps; they do not stack once per aircraft.\nA first-slot rocket rail gives a modern multirole design the CAS role for applicable production discounts. The cited 12.4% and 10% are country-specific examples. Check your actual production cost."
 MMG_air1194_note_6_label: "Aircraft Choices and Design Presets"
 MMG_air1194_note_6_t: "Aircraft Choices and Design Presets"
 MMG_air1194_note_6_d: "Interwar airframes have weak protection and are excluded from these 36 references. Dedicated CAS and strategic bombers need air cover. Choose heavy fighters, carrier aircraft and strategic bombers for the mission and production capacity.\nImport compatible presets with the designer clipboard-import button. Check the role, modules and available research before starting production."
 MMG_air1194_rules_t: "Missions, Modules and Research"
 MMG_air1194_rules_d: "Check module counts, design roles, mission effects and research requirements before comparing performance and cost."
 MMG_air1194_doctrine_301_label: "Battlefield Support and CAS Efficiency"
 MMG_air1194_doctrine_302_label: "Fighter and CAS Subdoctrines"
 MMG_air1194_doctrine_303_label: "Heavy Fighters and Strategic Bombing"
 MMG_air1194_doctrine_300_t: "Air Doctrine: Choose for the Mission"
 MMG_air1194_doctrine_300_d: "Battlefield Support and multirole/CAS aircraft are common choices in this guide. Air superiority, heavy fighters and strategic bombing serve different missions.\nChoose subdoctrines and mastery for the aircraft you actually use. Open Aircraft Designs for all 36 configurations."
 MMG_air1194_doctrine_301_t: "Battlefield Support and CAS Efficiency"
 MMG_air1194_doctrine_301_d: "Battlefield Support suits a force centered on CAS and multirole aircraft, with relevant spirits improving CAS efficiency.\nEfficiency does not directly multiply ground attack. Ground support and air combat still depend on available missions, ground battles and coverage."
 MMG_air1194_doctrine_302_t: "Fighter and CAS Subdoctrines"
 MMG_air1194_doctrine_302_d: "Choose fighter or CAS subdoctrines for your actual missions. The first weapon slot defines the design role; multirole use does not automatically grant every category bonus.\nAfter changing weapons, doctrines or focuses, recheck mission stats and production cost. Country-specific bonuses are not universal."
 MMG_air1194_doctrine_303_t: "Heavy Fighters and Strategic Bombing"
 MMG_air1194_doctrine_303_d: "Medium airframes support reconnaissance or heavy-fighter roles; large airframes support strategic bombing. These designs are options, not mandatory investments for every country.\nDevelop them for a defined long-range mission and sufficient industry. Provide air cover and check engine, electronics and sight technologies."
