 MMG_inf1194_spirit_menu_t: "Army Spirits: Choose by Requirements"
 MMG_inf1194_spirit_menu_d: "Browse common spirits costing 20, 35 or 50 army XP. Ideology, doctrines, academy and DLC affect availability. Mutually exclusive spirits cannot provide their bonuses at the same time."
