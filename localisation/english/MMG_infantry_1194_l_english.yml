 MMG_inf1194_index_t: "Division Templates: 1.19.4"
 MMG_inf1194_index_d: "Choose from eighteen division templates by role and doctrine. Each offers a full view, battalions and support, and stats and cost. Values depend on the equipment, doctrines and mastery shown."
 MMG_inf1194_note_1_t: "Reference Conditions and Doctrine Preset"
 MMG_inf1194_note_1_d: "Default: Mass Assault; Individual Excellence; Self-propelled Support; Tank Destroyer Force; Grand Assault.\nStats assume these doctrines and full mastery. The final three formations require doctrine changes. Adapt the designs to your research and production."
 MMG_inf1194_note_3_label: "1.19.4: Width and Logistics"
 MMG_inf1194_note_2_t: "1.19.4: Breakthrough and Armored Units"
 MMG_inf1194_note_2_d: "Tank destroyer (TD), self-propelled anti-air (SPAA) and self-propelled artillery (SPG) line battalions have -75% breakthrough; regimental TD/SPAA have -90%.\nTDs and SPGs get +25% defense; regimental TDs have -33% defense. Check the whole division's breakthrough before replacing tanks with TDs."
 MMG_inf1194_note_2_label: "1.19.4: Breakthrough and Armored Units"
 MMG_inf1194_note_4_label: "1.19.4: Regiment Size and Scaling"
 MMG_inf1194_note_3_t: "1.19.4: Width and Logistics"
 MMG_inf1194_note_3_d: "Mass Assault's infantry milestone and Large Unit Tactics each reduce infantry combat width by 0.2.\nFire Concentration adoption gives line artillery +10 organization. Mobile Recon & Assault gives logistics an extra -5% supply use. Individual Excellence's logistics HP bonus for motorized/mechanized is 2.5. Mass Assault's operations milestone gives -15% supply use."
 MMG_inf1194_note_4_t: "1.19.4: Regiment Size and Scaling"
 MMG_inf1194_note_4_d: "Mass Assault's +1 brigade size moved from the infantry milestone to artillery/combat support, which also gives +2% reinforce rate.\nSPG soft attack gains from technology were reduced. TD hard attack gains are 5% per technology, or 2.5% for regimental TDs. Armored HP scales with reliability; line and regimental units have different base HP."
 MMG_inf1194_note_51_t: "Engineers and Flame Support"
 MMG_inf1194_note_51_d: "Engineers, recon and flame tanks provide terrain modifiers. Assault and armored engineers require the relevant research and equipment.\nMedium flame tanks are the usual choice. Supply the required equipment to obtain their bonuses. Armored support vehicles are eligible for medium tank Military Industrial Organizations (MIOs)."
 MMG_inf1194_note_52_t: "Recon Company Roles"
 MMG_inf1194_note_52_d: "Recon Rangers provide terrain bonuses and require the relevant special forces unlock. Armored Recon Company (light tanks) gives armored and derivative battalions +10% hard attack.\nLight Armored Recon Company (armored cars) is a separate unit: Deep Battle's first reward lets it give leg infantry +5% soft attack and defense."
 MMG_inf1194_note_53_t: "Logistics and Field Hospitals"
 MMG_inf1194_note_53_d: "Logistics companies reduce supply and fuel use. Field Hospitals reduce experience loss and give infantry-category battalions +10% HP; this does not apply to every battalion.\nIndividual Excellence's logistics HP bonus for motorized/mechanized is now 2.5. Mobile Recon & Assault further reduces supply use. Trickleback has an upper limit."
 MMG_inf1194_note_54_t: "Fire Support and Regimental Support"
 MMG_inf1194_note_54_d: "Support artillery offers inexpensive early firepower. Choose anti-air support to counter aircraft or improve piercing. Regimental support normally requires at least three combat battalions in that regiment.\nInfantry Guns, heavy weapons, AA and armored support have distinct roles. Regimental TDs have a -90% breakthrough modifier, so high attack alone does not make them a universal tank replacement."
 MMG_inf1194_note_55_t: "Maintenance and Reliability"
 MMG_inf1194_note_55_d: "Maintenance costs a support slot and equipment; weigh attrition, capture and industry. Reliability now affects armored-equipment HP.\nEasy Maintenance gives -5% cost, +7.5% reliability and costs 20 XP to design. Equipment-capture calculations were fixed and capped at 100%."
 MMG_inf1194_note_56_t: "Occupation Laws and Compliance"
 MMG_inf1194_note_56_d: "Occupation benefits depend on compliance, garrison equipment and resistance. Civilian Oversight builds compliance; democracies can consider Local Autonomy.\nCommunist countries can use Liberated Workers for more factories and resources at the cost of compliance growth. Balance immediate gains against resistance and garrison needs."
 MMG_inf1194_note_61_t: "20 XP: Spirit of the Academy"
 MMG_inf1194_note_61_d: "Bold Attack helps develop offensive commanders: officers have a 50% chance to gain an extra +1 Attack when leveling up.\nThis affects officer development rather than directly increasing division attack. Availability depends on academy and DLC requirements."
 MMG_inf1194_note_62_t: "35 XP: Templates and Engineering"
 MMG_inf1194_note_62_d: "Bayonet Strength, available with Mass Assault, reduces template XP costs for infantry, motorized and mechanized units and increases infantry combat experience gain.\nElevated Engineer Corps reduces engineer template XP costs and improves entrenchment speed. Choose according to your current template changes or defensive preparations."
 MMG_inf1194_note_64_t: "35 XP: Ideology-Specific Spirits"
 MMG_inf1194_note_64_d: "State serves the Military: fascist, +10% offensive war stability modifier.\nRelief of Command: democratic, +25% army XP gain and -50% army advisor cost.\nIdeological Loyalty: communist, +500 weekly manpower and a reduced encirclement penalty. Check your ideology and available spirits first."
 MMG_inf1194_note_63_t: "50 XP: Spirit of Division Command"
 MMG_inf1194_note_63_d: "Operational Reserves: Mass Assault, +10% HP. Logistical Focus: Grand Battleplan, -10% supply use and -10% air/naval fuel use; army fuel use is unaffected.\nStatic Warfare suits entrenchment; Flexible Organization helps maintain organization while moving. Both have doctrine requirements."
