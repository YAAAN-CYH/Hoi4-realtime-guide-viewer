 MMG_inf1194_menu_40_t: "Formations Requiring Doctrine Changes (1/1)"
 MMG_inf1194_menu_40_d: "Select a template, then browse the other formations in this group. The final three templates require the specified doctrine changes."
 MMG_inf1194_template_16_full_t: "Wide Infantry / Medium TDs: Doctrine Change (1/3)"
 MMG_inf1194_template_16_full_d: "Fifteen infantry and ten medium TD battalions; requires Large Unit Tactics as the infantry subdoctrine.\nMass Assault and Large Unit Tactics each remove 0.2 infantry width: 15 x 1.6 + 10 x 2 = 44.\nWidth 44; organization 45.8; HP 438.9."
