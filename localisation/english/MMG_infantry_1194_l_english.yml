 MMG_inf1194_land_105_label: "Operations: Grand Assault / Infiltration Tactics"
 MMG_inf1194_land_100_t: "Army Doctrine: 1.19.4 Reference"
 MMG_inf1194_land_100_d: "Choose a grand doctrine and separate infantry, artillery/combat support, armor and operations subdoctrines. Most templates use Mass Assault and Individual Excellence; the final three require changes.\nDoctrines and mastery affect combat width, organization and logistics. Check each template's requirements before comparing."
 MMG_inf1194_land_101_t: "Grand Doctrine: Choosing a Main Path"
 MMG_inf1194_land_101_d: "Mass Assault or Grand Battleplan are the usual references. The Mass Assault infantry milestone removes 0.2 infantry width and can combine with Large Unit Tactics.\nMobile Warfare now gives the army +15% breakthrough at its armor milestone, so reassess it for armor-focused play."
 MMG_inf1194_land_102_t: "Infantry: Individual Excellence and Alternatives"
 MMG_inf1194_land_102_d: "Most templates use Individual Excellence. Its logistics HP bonus for motorized/mechanized fell from 5 to 2.5.\nThe wide infantry and infantry-artillery variants require Large Unit Tactics; cavalry-artillery requires Mounted Infantry. Recalculate combat width and organization after switching."
 MMG_inf1194_land_103_t: "Artillery and Combat Support Subdoctrines"
 MMG_inf1194_land_103_d: "Self-propelled Support suits armored support vehicles. Mobile Recon & Assault gives logistics an extra -5% supply use. Fire Concentration adoption gives line artillery +10 organization.\nSPG bonuses were reduced. After changing doctrines, recheck combat width, organization and regimental support alongside cost and firepower."
 MMG_inf1194_land_104_t: "Armor: Tank Destroyer and Tank Roles"
 MMG_inf1194_land_104_d: "Tank destroyers emphasize hard attack and piercing; tanks still provide breakthrough. Choose Tank Destroyer Force or Mobile Defense to suit your main vehicles.\nFor TDs, line battalions have a -75% breakthrough modifier and regimental support has -90%. Defensive anti-armor and offensive breakthrough require different designs."
 MMG_inf1194_land_105_t: "Operations: Grand Assault / Infiltration Tactics"
 MMG_inf1194_land_105_d: "Grand Assault and Infiltration Tactics are common choices. Choose for your force and available mastery.\nSeparately, Mass Assault's operations milestone gives -15% supply use. Its minimum training modifier changes from -5% to -10%, and its former +5% entrenchment speed is removed."
