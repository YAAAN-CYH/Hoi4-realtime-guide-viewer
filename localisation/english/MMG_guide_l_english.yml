 MMG_land_menu_t: "Army Doctrine - Overview"
 MMG_land_menu_d: "Recommended paths: Grand Battleplan or Mass Assault; Superior Individual Soldier for infantry; Self-Propelled Support, or Mobile Reconnaissance and Assault, for artillery; Tank Destroyer Units or Mobile Defense for armor; and Massed Assault or Infiltration Tactics for operations. Select a topic for details."
 MMG_land_menu_opt_main: "Main: Grand Battleplan / Mass Assault"
 MMG_land_menu_opt_infantry: "Infantry: Superior Individual Soldier"
 MMG_land_menu_opt_artillery: "Artillery: SP Support / Mobile Recon and Assault"
 MMG_land_menu_opt_armored: "Armor: TD Units / Mobile Defense"
 MMG_land_menu_opt_operational: "Operations: Massed Assault / Infiltration"
 MMG_land_menu_opt_spirits: "Army Spirits (20/35/50 XP)"

 MMG_land_main_t: "Main Doctrine: Grand Battleplan / Mass Assault"
 MMG_land_main_d: "Grand Battleplan has better raw stats, while Mass Assault gains a Mobile Defense tactic card. Both are strong. Superior Firepower was heavily nerfed, and Mobile Warfare remains unattractive, so these two are usually the best choices."
 MMG_land_infantry_t: "Infantry Doctrine: Superior Individual Soldier"
 MMG_land_infantry_d: "Superior Individual Soldier is the clear infantry choice. Even the mysterious powers do not recommend Militia Doctrine; the individual-soldier bonuses remain more valuable."
 MMG_land_artillery_t: "Artillery: Self-Propelled Support / Mobile Recon and Assault"
 MMG_land_artillery_d: "Prefer Self-Propelled Support. Its effect is limited without SPGs, but its bonuses to SPGs and tank destroyers are excellent. For variety, Mobile Reconnaissance and Assault is the next-best option."
 MMG_land_armored_t: "Armor: Tank Destroyer Units / Mobile Defense"
 MMG_land_armored_d: "Tank destroyers now outperform ordinary tanks. Choose Tank Destroyer Units for a TD build, or Mobile Defense to strengthen tanks if you do not want TDs. Both routes are stronger than relying on traditional tanks alone."
 MMG_land_operational_t: "Operations: Massed Assault / Infiltration Tactics"
 MMG_land_operational_d: "Massed Assault combines the left branches of Grand Battleplan and Mass Assault. Infiltration Tactics resembles the combined right branch of Grand Battleplan. Choose based on direct assaults versus flanking encirclements."
 MMG_land_spirits_t: "Army Spirits - XP Recommendations"
 MMG_land_spirits_d: "20 XP: Bold Attack. 35 XP: National Service Army for fascist offensive wars, Tip of the Bayonet for Mass Assault, Engineering Corps, Relief of Command for democracies, or Ideological Loyalty for small communist countries. 50 XP: Tactical Reserves for Mass Assault, or Logistics Focus for Grand Battleplan; use Static Warfare or Flexible Organization as needed."

 MMG_naval_menu_t: "Naval Doctrine - Overview"
 MMG_naval_menu_d: "The three naval doctrines are fairly similar. Pick the branch that suits your fleet instead of grinding British or American naval mastery for minor bonuses. Naval visibility is crucial: reduce it whenever possible."
 MMG_naval_menu_opt_main: "Doctrine Choice and Main Strategies"
 MMG_naval_menu_opt_spirits: "Naval Spirits and Visibility"

 MMG_naval_main_t: "Naval Doctrine: Follow Your Fleet Strategy"
 MMG_naval_main_d: "The three doctrines differ little. Choose a submarine, screen, battleship, or carrier branch and continue down it. Even mastering the British or US navy may not provide enough mastery for another doctrine. Indoctrinated Aggression at 20 XP can stack attack."
 MMG_naval_spirits_t: "Naval Spirits and Visibility"
 MMG_naval_spirits_d: "Naval Refit Yards greatly speeds repairs and refits. Raiding Fleet Designer lowers visibility, reducing interception risk and combat losses. Lower visibility means greater effectiveness; several useful 50 XP options are also available."

 MMG_air_menu_t: "Air Doctrine - Overview"
 MMG_air_menu_d: "Battlefield Support is the standout air doctrine. Prioritize fighter and close-air-support branches. Medium and large aircraft doctrines see little use and gain mastery too slowly, so they can be left empty."
 MMG_air_menu_opt_core: "Battlefield Support (Core)"
 MMG_air_menu_opt_fighter: "Fighter / Close Air Support Branches"
 MMG_air_menu_opt_bomber: "Medium and Large Aircraft: Why Skip Them"

 MMG_air_core_t: "Air Doctrine: Battlefield Support"
 MMG_air_core_d: "The 25% Close Air Support efficiency bonus in Battlefield Support is the most important air-doctrine effect. Invest doctrine resources in this node and the nearby branches first."
 MMG_air_fighter_cas_t: "Fighter / Close Air Support Branches"
 MMG_air_fighter_cas_d: "Research-speed bonuses for fighters and CAS are valuable, as are Aircrew Surveys. Aircrew Surveys remain strong despite their nerf. Medium and large aircraft branches can be ignored."
 MMG_air_bombers_t: "Medium and Large Aircraft: Why Skip Them"
 MMG_air_bombers_d: "Medium and large aircraft doctrines and mastery grow too slowly and have little practical value. Keep your points in Battlefield Support and the fighter/CAS system."

 MMG_army_menu_t: "Division Templates - Overview"
 MMG_army_menu_d: "Template rules: roughly 3 infantry per artillery, or 1 infantry per tank. SPGs replace artillery and TDs replace tanks. Main divisions should be 35-36 width. Medium SPG > light SPG > artillery, and TD > tank. Select a topic for details."
 MMG_army_menu_opt_logic: "Ratios and Battalion Roles"
 MMG_army_menu_opt_main: "Main Divisions: Early to Heavy"
 MMG_army_menu_opt_filler: "Line-Filler Divisions"
 MMG_army_menu_opt_defense: "Defensive Divisions"
 MMG_army_menu_opt_support: "Support Companies and Regimental Support"
 MMG_army_menu_opt_occupation: "Occupation Laws and Suppression"

 MMG_army_logic_t: "Template Rules and Battalion Roles"
 MMG_army_logic_d: "Use about three infantry battalions per artillery battalion, or one infantry per tank; never use fewer infantry. SPGs replace artillery, while TDs replace tanks. Anti-air can cover air attack, anti-armor, and piercing roles."
 MMG_army_main_t: "Main Divisions: Early to Heavy"
 MMG_army_main_d: "Around 1939, use howitzer tanks or SPGs. Poor Asian countries can use cheap chassis with anti-air guns. As output rises, move toward roughly 10 infantry and 8 tanks, then 9 infantry and 9 tanks, or 9 infantry, 8 tanks, and 2 AA. Mechanized and TDs are stronger but costlier upgrades."
 MMG_army_filler_t: "Line-Filler Divisions"
 MMG_army_filler_d: "Line fillers only delay the enemy until main divisions arrive; they are not meant to defend or defeat attacks. Avoid them when possible and never give them advanced equipment. A one-infantry, 100-rifle training template is another low-cost option."
 MMG_army_defense_t: "Defensive Divisions"
 MMG_army_defense_d: "A classic 7-infantry/2-artillery division has modest offense but low cost and can stop vanilla AI effectively. It is a second-line main division for defense and counterattacks, and should receive a full set of support companies."
 MMG_army_support_t: "Support Companies and Regimental Support"
 MMG_army_support_d: "Engineers, recon, and flame tanks provide terrain bonuses and are nearly mandatory. Armored recon is the only recon choice for stacking hard attack. Hospitals add 10% HP and preserve experience; logistics reduces supply and fuel use. Maintenance is a beginner trap, useful mainly to unlock Easy Maintenance in 1939. Regimental support requires three combat battalions; use infantry guns, AA, heavy weapons, or TD support as needed."
 MMG_army_occupation_t: "Occupation Laws and Suppression Templates"
 MMG_army_occupation_d: "Suppression is automatic; you only choose the law and template. Civilian Oversight builds compliance for fascist and non-aligned countries; Local Autonomy is fastest for democracies. Liberated Workers gives communists +20% factories and +30% resources but lowers compliance. Use cavalry with Military Police, or cheap light tanks when manpower is scarce."

 MMG_tank_menu_t: "Tank Designs - Select a Topic"
 MMG_tank_menu_d: "In the tank designer, first use the role button to choose the vehicle type. The topics below cover the interwar chassis, medium tanks, self-propelled artillery, tank destroyers, and other vehicles. Use View Another Topic to return here."
 MMG_tank_menu_opt_intro: "Basics: Role and Main Armament"
 MMG_tank_menu_opt_light: "Early Asian Theater: Interwar Chassis"
 MMG_tank_menu_opt_medium: "Medium Tank: Early 1939 Mainstay"
 MMG_tank_menu_opt_spg: "Light SPG Designs"
 MMG_tank_menu_opt_td: "Tank Destroyer (TD)"
 MMG_tank_menu_opt_flame: "Flame Tanks and Armored Support Vehicles"
 MMG_tank_menu_opt_mech: "Mechanized IFV / Armored Recon Vehicle"

 MMG_tank_intro_t: "Tank Design Basics: Choose the Role First"
 MMG_tank_intro_d: "The role button determines the vehicle type: cannons can become TDs, close-support guns or howitzers can become SPGs, AA weapons can become SPAA, and flamethrowers can become flame tanks. This topic shows the button and role-selection process rather than an additional finished tank design."
 MMG_tank_light_t: "Early Asian Theater: Interwar Chassis"
 MMG_tank_light_d: "This design uses an interwar medium-tank chassis to stack breakthrough during the early Asian campaign. It has 4 km/h speed, 20 armor, 39.6 breakthrough, 76.4% reliability, and 6.44 production cost, making it a practical transitional armored design for early mass production."
 MMG_tank_medium_t: "Medium Tank: Early 1939 Mainstay"
 MMG_tank_medium_d: "The 1939 medium cannon is weak, so use a 1939 howitzer tank or SPG early. Keep armor at level 5 or lower to avoid extra steel cost, and add engine upgrades to maintain 4 km/h. Easy Maintenance, unlocked by 1939 Maintenance Company research, is the best cost-saving module."
 MMG_tank_spg_t: "Light SPG Designs"
 MMG_tank_spg_d: "This topic presents two light-SPG designs. Light SPGs have little breakthrough but provide high soft attack at low cost. The second costs about 8 for 50 soft attack and can add heavy machine guns. Medium SPGs are stronger overall but are outside this topic's scope."
 MMG_tank_td_t: "Tank Destroyer (TD)"
 MMG_tank_td_d: "The finished TD uses the 1943 advanced high-velocity cannon for exceptional piercing and hard attack; mounting it on a medium chassis requires a fixed superstructure. The other two cannon configurations still use the Medium Tank role and must be converted to TD with the role button."
 MMG_tank_flame_t: "Flame Tanks and Armored Support Vehicles"
 MMG_tank_flame_d: "After Ground Warfare research unlocks armored support vehicles, skip the free 13.8-cost model. Produce the auto-retired 12-cost model and combine it with MIO cost reductions. For flame tanks, use a medium flame chassis and level-2 flamethrower; fuel drums extend the division's fuel endurance."
 MMG_tank_mech_t: "Mechanized IFVs and Armored Recon Vehicles"
 MMG_tank_mech_d: "The mechanized IFV is required for mechanized infantry: use the 5-cost, 2-reliability, 125-XP design. Mechanized infantry outclasses infantry but consumes steel and rubber; level 1 is enough. Armored recon vehicles serve recon and dummy-template training, so keep them cheap and reliable."

 MMG_plane_menu_t: "Aircraft Designs - Select a Topic"
 MMG_plane_menu_d: "The air-force mainstay is a multirole fighter amplified by Close Air Support efficiency. Pure fighters defend airspace; CAS bombs after air superiority is secured. Select a topic for designs and examples."
 MMG_plane_menu_opt_multirole: "Multirole Fighter (Recommended Mainstay)"
 MMG_plane_menu_opt_fighter: "Pure Fighter / Interceptor"
 MMG_plane_menu_opt_cas: "Close Air Support (CAS)"
 MMG_plane_menu_opt_equip: "Modules and Year-by-Year Progression"

 MMG_plane_multirole_t: "Multirole Fighter (Recommended Mainstay)"
 MMG_plane_multirole_d: "A multirole is essentially a fighter assigned to CAS. At 145-165% CAS efficiency, a multirole with two heavy machine guns outdamages a pure fighter with three. Fly it only where ground combat is active; ground AA can shoot it down easily."
 MMG_plane_fighter_t: "Pure Fighter / Interceptor"
 MMG_plane_fighter_d: "Pure fighters suit straits and homeland defense. Armor plates and self-sealing fuel tanks act as aircraft HP; add at least one extra fuel tank. If both defensive modules cannot fit, choose by situation. Air weapon priority: level-2 cannon > heavy machine gun > everything else."
 MMG_plane_cas_t: "Close Air Support (CAS)"
 MMG_plane_cas_d: "CAS bombs after air superiority is secured. Stack range and damage; defense matters little. Air doctrine, advisors, and Close Air Support efficiency all multiply CAS output."
 MMG_plane_equip_t: "Modules and Year-by-Year Progression"
 MMG_plane_equip_d: "Rocket rails do not reduce speed and are standard on midwar multiroles. With identical modules, putting the ground weapon first lets a CAS multirole receive both CAS and fighter cost reductions. The final 1944 slot only accepts ground weapons, and level-2 cannons are the best late air weapon. The last page only locates rocket-rail technology."

 MMG_ship_menu_t: "Ship Designs - Select a Topic"
 MMG_ship_menu_d: "Capital ships include battleships, battlecruisers, and heavy cruisers. A typical carrier fleet uses about 4 carriers, 4 battleships, 8 light cruisers, and 20 destroyers. Select a topic for designs and examples."
 MMG_ship_menu_opt_fleet: "Carriers and Main Fleet Composition"
 MMG_ship_menu_opt_capital: "Battleship / Battlecruiser"
 MMG_ship_menu_opt_cruiser: "Light Cruisers and Main Screens"
 MMG_ship_menu_opt_dd: "Destroyers"
 MMG_ship_menu_opt_sub: "Submarines and Anti-Submarine Warfare"
 MMG_ship_menu_opt_carair: "Carrier Aircraft"

 MMG_ship_fleet_t: "Carriers and Main Fleet Composition"
 MMG_ship_fleet_d: "A 1936 carrier filled with hangars is the standard design. Carriers need capital-ship screening to sortie effectively; use no more carriers than battleships and battlecruisers. A typical fleet is 4 carriers, 4 battleships, 8 light cruisers, and 20 destroyers."
 MMG_ship_capital_t: "Battleship / Battlecruiser"
 MMG_ship_capital_d: "Battleships and battlecruisers differ mainly in armor: battleships are tougher and slower, while battlecruisers are faster and more fragile. Secondary-heavy battleships are cheaper; heavy-gun builds are stronger but costly. Tank battleships absorb damage for carriers."
 MMG_ship_cruiser_t: "Light Cruisers and Main Screens"
 MMG_ship_cruiser_d: "Place 2-3 scout light cruisers in a separate patrol set to Never Engage; they find enemies rather than fight. Main-fleet light cruisers destroy enemy screens and can use advanced fire control. Heavy cruisers are viable but harder to use."
 MMG_ship_dd_t: "Destroyers"
 MMG_ship_dd_d: "Cheap screening destroyers absorb frontline damage and maintain screening efficiency so capital ships and carriers can keep firing. Torpedo destroyers suit a green-water strategy: after light cruisers clear enemy screens, massed torpedoes finish the capital ships behind them."
 MMG_ship_sub_t: "Submarines and Anti-Submarine Warfare"
 MMG_ship_sub_d: "This topic presents ASW configurations rather than submarine designs. For submarines, use at least a 1940 hull, maximize torpedoes, minimize visibility, avoid shallow seas, and deploy enough boats. For ASW, prefer carrier torpedo bombers or naval bombers; ASW destroyers come second."
 MMG_ship_carair_t: "Carrier Aircraft"
 MMG_ship_carair_d: "Carrier designs fall into torpedo/naval bombers and dive/CAS bombers. Torpedo aircraft attack capital ships and submarines; multirole torpedo bombers with heavy machine guns are stronger, while carrier CAS is weaker. A carrier can use only multirole torpedo bombers."
