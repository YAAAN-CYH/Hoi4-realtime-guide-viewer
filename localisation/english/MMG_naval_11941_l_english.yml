 MMG_naval11941_note_1: "Research, Range and Support Ships"
 MMG_naval11941_note_1_t: "Research, Range and Support Ships"
 MMG_naval11941_note_1_d: "Naval special projects and follow-up techs unlock specialist hulls and modules. No conventional missile-submarine design is listed. A 500 km midget sub needs a nearby base. Support ships extend fleet range, while repair ships help limit severe damage. Build these two support types from their existing models."
 MMG_naval11941_note_2: "Carrier Capacity and Sorties"
 MMG_naval11941_note_2_t: "Carrier Capacity and Sorties"
 MMG_naval11941_note_2_d: "A single-deck escort carrier holds 10 aircraft, or 20 with Space Efficient Design from an eligible MIO. Check the opposing fleet and sortie efficiency when judging combat sorties. Submarine carriers can fly carrier air missions. Habakkuk accepts non-carrier aircraft listed in its deployment menu."
