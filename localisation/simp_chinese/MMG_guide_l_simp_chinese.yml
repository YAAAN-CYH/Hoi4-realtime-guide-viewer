 MMG_land_doctrine_decision: "陆军学说"
 MMG_land_doctrine_decision_desc: "查看陆军学说与陆军精神的1.19版本推荐选择。"
 MMG_naval_doctrine_decision: "海军学说"
 MMG_naval_doctrine_decision_desc: "查看海军学说的取舍与海军精神推荐。"
 MMG_air_doctrine_decision: "空军学说"
 MMG_air_doctrine_decision_desc: "查看空军学说：只点战场支援及相关条目的原因。"
 MMG_army_org_decision: "陆军编制"
 MMG_army_org_decision_desc: "查看主力师、填线师、防守师以及支援连和占领编制推荐。"
 MMG_tank_design_decision: "坦克设计"
 MMG_tank_design_decision_desc: "查看战间期/中型坦克底盘、自行火炮、自行反坦克炮等车辆设计推荐。"
 MMG_plane_design_decision: "飞机设计"
 MMG_plane_design_decision_desc: "查看多功能战斗机、纯种战斗机与近地支援机设计推荐。"
 MMG_ship_design_decision: "舰船设计"
 MMG_ship_design_decision_desc: "查看航母、主力舰、屏卫与舰载机设计推荐。"

