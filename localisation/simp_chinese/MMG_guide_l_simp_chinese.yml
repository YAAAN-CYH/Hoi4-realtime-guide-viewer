 MMG_detail_back: "我还想看看其他的"

 MMG_land_menu_t: "陆军学说 · 推荐总览"
 MMG_land_menu_d: "主学说推荐决战计划/人海突击；步兵学说无脑卓越单兵；火炮学说推荐自行式支援，次级为机动侦查与突击；装甲学说推荐自行反坦克炮部队或机动防御；作战学说选大规模强袭/渗透战术。选一项查看配图与说明。"
 MMG_land_menu_opt_main: "主学说：决战计划 / 人海突击"
 MMG_land_menu_opt_infantry: "步兵学说：卓越单兵"
 MMG_land_menu_opt_artillery: "火炮学说：自行式支援 / 机动侦查与突击"
 MMG_land_menu_opt_armored: "装甲学说：自行反坦克炮部队 / 机动防御"
 MMG_land_menu_opt_operational: "作战学说：大规模强袭 / 渗透战术"
 MMG_land_menu_opt_spirits: "陆军精神（20/35/50 XP）"

 MMG_land_main_t: "主学说：决战计划 / 人海突击"
 MMG_land_main_d: "决战计划的数据优于人海，人海则有一张机动防御战术卡，两边各有优势；优势火力已遭大削，机动作战仍然无人问津，所以一般只在这两者里选择。"
 MMG_land_infantry_t: "步兵学说：卓越单兵"
 MMG_land_infantry_d: "步兵学说无脑选卓越单兵。连神秘势力都不推荐民兵学说；卓越单兵依然比它重要。"
 MMG_land_artillery_t: "火炮学说：自行式支援 / 机动侦查与突击"
 MMG_land_artillery_d: "首选自行式支援：虽然不出自火时能吃到效果有限，但对自火和坦歼的加成非常可观。玩腻后可换机动侦查与突击，它仅次于自行式支援。"
 MMG_land_armored_t: "装甲学说：自行反坦克炮部队 / 机动防御"
 MMG_land_armored_d: "坦歼现在是坦克的完全上位替代，走坦歼流选自行反坦克炮部队；不想玩坦歼就选机动防御强化坦克。两条路线都强于继续依赖传统坦克。"
 MMG_land_operational_t: "作战学说：大规模强袭 / 渗透战术"
 MMG_land_operational_d: "大规模强袭相当于决战计划左线与人海突击左线的整合；渗透战术相当于决战计划右线的整合。按主力师打强攻或绕后包围选择。"
 MMG_land_spirits_t: "陆军精神 · XP购买推荐"
 MMG_land_spirits_d: "20XP大胆进攻。35XP：国家服务军队（黑色国家侵略战+10%稳定）、人海专用刺刀之锋、工程兵团、解除指挥权（蓝色国家）、忠于意识形态（小国转红线）。50XP：人海战术储备减损耗、决战专注后勤减补给与油耗；静态战争、灵活组织视情况。"

 MMG_naval_menu_t: "海军学说 · 总览"
 MMG_naval_menu_d: "海军三个学说差别不大，按玩法挑顺眼的下点即可；不必为了少数buff硬刷英美海军精通。海军可见度非常关键，能压低就要压低。"
 MMG_naval_menu_opt_main: "学说选择与主流打法"
 MMG_naval_menu_opt_spirits: "海军精神与海军可见度"

 MMG_naval_main_t: "海军学说：按打法顺手下点"
 MMG_naval_main_d: "三个海军学说差别不大，潜艇、屏卫、战列、航母四系选一个顺眼的往下点即可；刷完英美海军也未必够精通去开别的学说。20XP的灌输侵略可叠攻击。"
 MMG_naval_spirits_t: "海军精神与可见度"
 MMG_naval_spirits_d: "海军整修船坞修船/改船加速很有用；袭击舰队制造商压低可见度，能降低被抓包风险与战斗损失。可见度越低强度越高，50XP内也有实用条目可自选。"

 MMG_air_menu_t: "空军学说 · 总览"
 MMG_air_menu_d: "空军学说只有一个太阳：战场支援。战斗机与近地机相关条目优先；中飞机与大飞机学说用不上且精通难涨，空着即可。"
 MMG_air_menu_opt_core: "战场支援学说（核心）"
 MMG_air_menu_opt_fighter: "战斗机 / 近地机条目"
 MMG_air_menu_opt_bomber: "中飞机与大飞机：放弃原因"

 MMG_air_core_t: "空军学说：战场支援"
 MMG_air_core_d: "战场支援学说的25%密接效率是空军最重要的一条。学说资源优先投入这条及其附近条目。"
 MMG_air_fighter_cas_t: "战斗机 / 近地机条目"
 MMG_air_fighter_cas_d: "战斗机与近地机相关研究速度和机组访谈都有价值；机组访谈虽被削弱仍是好条目。中飞机与大飞机不用管。"
 MMG_air_bombers_t: "中飞机与大飞机：放弃原因"
 MMG_air_bombers_d: "中飞机与大飞机的学说与精通难以成长，实际作战也用不上；把点数留在战场支援与战斗机、近地机体系即可。"

 MMG_army_menu_t: "陆军编制 · 总览"
 MMG_army_menu_d: "编制逻辑：步兵配火炮约3:1，配坦克约1:1；自火与坦歼分别是火炮与坦克的完全上位替代。主力师宽度35~36宽，中自火＞轻自火＞火炮，坦歼＞坦克。选一项查看详情。"
 MMG_army_menu_opt_logic: "编制比例与兵种定位"
 MMG_army_menu_opt_main: "主力师：从早期到重装"
 MMG_army_menu_opt_filler: "填线师"
 MMG_army_menu_opt_defense: "防守师"
 MMG_army_menu_opt_support: "支援连与团支援连"
 MMG_army_menu_opt_occupation: "占领法案与镇压编制"

 MMG_army_logic_t: "编制逻辑与兵种定位"
 MMG_army_logic_d: "步兵：火炮约3:1；步兵：坦克约1:1，步兵只多不少。自火替代火炮、坦歼替代坦克。防空炮能兼职对空、反装甲与穿甲。"
 MMG_army_main_t: "主力师：从早期到重装"
 MMG_army_main_d: "早期39年前后用39榴弹炮坦克或自火；亚洲穷国可用便宜底盘加防空炮。随产量上升逐步替换成约10步8坦，后期9步9坦或9步8坦2防空炮；机械化与坦歼是更贵的上位替代。"
 MMG_army_filler_t: "填线师"
 MMG_army_filler_d: "填线师只用于主力未及时参战时拖延时间，不是用来防守或击退敌人的。能不出就不出，出则不配高级军备；也有1步转100枪低成本训练流派。"
 MMG_army_defense_t: "防守师"
 MMG_army_defense_d: "防守师如经典七步二炮：进攻能力一般，但造价不高，能有效挡住原版AI，属于承担防御与击退任务的二线主力师，需要塞满支援连。"
 MMG_army_support_t: "支援连与团支援连"
 MMG_army_support_d: "工兵/侦察/喷火给地形修正，几乎必带；坦侦是叠硬攻的唯一侦察选择。医院10%HP加保经验，后勤降补给油耗。维修连是萌新天坑，只为39年易维护改装点科技。团支需3个作战营，步兵炮/防空炮/重武器/坦歼团支按需使用。"
 MMG_army_occupation_t: "占领法案与镇压编制"
 MMG_army_occupation_d: "镇压是全自动的，手动部分只有法案与编制。黑灰民间监督优先涨顺从；蓝方地方自治最快；红方解放工人加20%工厂与30%资源但扣顺从。镇压用骑兵并配宪兵MP，人力紧张可用便宜轻坦。"

 MMG_tank_menu_t: "坦克设计 · 请选择"
 MMG_tank_menu_d: "进入坦克设计页后，先通过设计按钮选择车辆类型。此页选项对应攻略中的战间期底盘、中型坦克、自行火炮与自行反坦克炮等章节；查看完某项可点“我还想看看其他的”返回本页。"
 MMG_tank_menu_opt_intro: "设计入门：类型与主武器"
 MMG_tank_menu_opt_light: "亚洲战场初期战间期底盘"
 MMG_tank_menu_opt_medium: "中型坦克：39年早期主力"
 MMG_tank_menu_opt_spg: "轻型自行火炮设计"
 MMG_tank_menu_opt_td: "自行反坦克炮（坦歼）"
 MMG_tank_menu_opt_flame: "喷火坦克与装甲支援车"
 MMG_tank_menu_opt_mech: "机械化步战车 / 坦侦车"

 MMG_tank_intro_t: "坦克设计入门：先选类型"
 MMG_tank_intro_d: "设计按钮决定车辆角色：加农炮可转为坦歼，近距支援炮或榴弹炮可转为自行火炮，防空武器可转为自行防空炮，喷火器可转为喷火坦克。本条展示按钮位置与角色选择方法，不代表额外的成品坦克设计。"
 MMG_tank_light_t: "亚洲战场初期战间期底盘"
 MMG_tank_light_d: "该方案采用战间期中型坦克底盘，用于亚洲战场初期叠加突破。图示速度4千米/时、装甲厚度20、突破39.6、可靠性76.4%，生产花费6.44，适合作为较早投入量产的过渡型装甲方案。"
 MMG_tank_medium_t: "中型坦克：39年早期主力"
 MMG_tank_medium_d: "39年中加农炮数据差，早期用39榴弹炮坦克或自火。装甲不超过5级，再多会额外耗钢；记得补引擎保4km/h。39维修连科技解锁的易维护改装是最值得上的省钱配件。"
 MMG_tank_spg_t: "轻型自行火炮设计"
 MMG_tank_spg_d: "本条展示两套轻型自行火炮设计。轻型自行火炮突破较低，但造价低、软攻高；第二套约8造价、50软攻，还可追加重机枪。中型自行火炮综合性能更强，但不在本条展示范围内。"
 MMG_tank_td_t: "自行反坦克炮（坦歼）"
 MMG_tank_td_d: "成品坦歼采用43年先进高速加农炮，具有很高的穿深与硬攻；中型底盘安装该武器时需要固定炮台。另两套加农炮方案当前仍是中型坦克角色，仅用于展示武器配置，使用时需通过设计按钮切换为坦歼。"
 MMG_tank_flame_t: "喷火坦克与装甲支援车"
 MMG_tank_flame_d: "地面战科研解锁装甲支援车后，送的那辆13块8不要生产，生产自动退役的12块款并叠MIO偷工减料可压价。喷火坦克选中型喷火车与2级喷火器，油罐能提升师油料续航。"
 MMG_tank_mech_t: "机械化步战车与坦侦车"
 MMG_tank_mech_d: "机械步战车是机械化步兵的前置：5造价、2可靠加125XP设计，机械步兵是步兵全面上位替代但耗钢耗胶，1级足够。坦侦车用于装甲侦察与假模板训练，要求便宜且可靠。"

 MMG_plane_menu_t: "飞机设计 · 请选择"
 MMG_plane_menu_d: "空军主力是密接效率加成下的多功能战斗机；纯种战斗机用于防空，CAS用于夺取制空权后的轰炸。逐项查看设计思路与配图。"
 MMG_plane_menu_opt_multirole: "多功能战斗机（主力推荐）"
 MMG_plane_menu_opt_fighter: "纯种战斗机 / 防空截击"
 MMG_plane_menu_opt_cas: "近地支援机（CAS）"
 MMG_plane_menu_opt_equip: "配件与年份演变"

 MMG_plane_multirole_t: "多功能战斗机（主力推荐）"
 MMG_plane_multirole_d: "多功能的本质是挂近地支援任务的战斗机：把密接效率加成叠到145%到165%后，2挺重机枪多功能输出高于3挺重机枪纯战斗。只在有地面交战时起飞，易被地面防空击落。"
 MMG_plane_fighter_t: "纯种战斗机 / 防空截击"
 MMG_plane_fighter_d: "纯种战斗机适合海峡与本土防空：装甲板与自闭油箱等于飞机血量，至少要一个额外油箱；两者不能同上是按情况取舍。对空武器优先级：2级机炮＞重机枪＞其他。"
 MMG_plane_cas_t: "近地支援机（CAS）"
 MMG_plane_cas_d: "CAS在夺取制空权后执行轰炸，只需堆航程和输出，防御并不重要。空军学说、顾问与密接效率加成都会放大CAS输出。"
 MMG_plane_equip_t: "配件与年份演变"
 MMG_plane_equip_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。"

 MMG_ship_menu_t: "舰船设计 · 请选择"
 MMG_ship_menu_d: "主力舰指战列舰、战巡与重巡；典型航母舰队约4航母+4战列舰+8轻巡+20驱逐。选一项查看对应设计建议与配图。"
 MMG_ship_menu_opt_fleet: "航母与主力舰队结构"
 MMG_ship_menu_opt_capital: "战列舰 / 战列巡洋舰"
 MMG_ship_menu_opt_cruiser: "轻巡洋舰与主力屏卫"
 MMG_ship_menu_opt_dd: "驱逐舰"
 MMG_ship_menu_opt_sub: "潜艇与反潜"
 MMG_ship_menu_opt_carair: "航母舰载机"

 MMG_ship_fleet_t: "航母与主力舰队结构"
 MMG_ship_fleet_d: "36年航母塞满机库最常见。航母需要主力舰屏卫才能正常出击，航母数量等于或略少于战列/战巡数量；典型配置4航母加4战列舰加8轻巡加20驱逐。"
 MMG_ship_capital_t: "战列舰 / 战列巡洋舰"
 MMG_ship_capital_d: "战列与战巡只差护甲：战列更厚更慢，战巡更快更脆。战列舰叠副炮较便宜，叠重炮更强但造价高；肉盾战列专门替航母扛伤害。"
 MMG_ship_cruiser_t: "轻巡与主力屏卫"
 MMG_ship_cruiser_d: "侦查轻巡单独编队开避免交战巡逻，2到3条就够，负责找人而非打仗；主力轻巡用于融化敌方屏卫，可换先进火控。重巡也能打但玩法门槛较高。"
 MMG_ship_dd_t: "驱逐舰"
 MMG_ship_dd_d: "肉盾驱逐在前排承伤，维持屏卫效率，让主力舰与航母持续输出。鱼雷驱逐是绿水学派武器：轻巡融化屏卫后，由雷驱用大量鱼雷收割后排主力舰。"
 MMG_ship_sub_t: "潜艇与反潜"
 MMG_ship_sub_d: "本条展示的是反潜方案，不是潜艇设计。潜艇建议至少采用40年型船体、装满鱼雷并压低可见度，避开英吉利海峡等浅海，同时保证部署数量；反潜优先使用舰载鱼雷机与海军轰炸机，反潜驱逐舰次之。"
 MMG_ship_carair_t: "航母舰载机"
 MMG_ship_carair_d: "舰载机只有舰攻（鱼雷/海军轰炸机）与舰爆（近距支援机）两类设计。舰攻能打主力舰与潜艇，鱼雷机上重机枪的多功能更强，舰爆较落后；航母可以只塞多功能舰攻。"
