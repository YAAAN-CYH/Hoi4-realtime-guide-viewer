 MMG_gallery_501_t: "坦克设计入门：先选类型（1/3）"
 MMG_gallery_501_d: "设计按钮决定车辆角色：加农炮可转为坦歼，近距支援炮或榴弹炮可转为自行火炮，防空武器可转为自行防空炮，喷火器可转为喷火坦克。本条展示按钮位置与角色选择方法，不代表额外的成品坦克设计。\n补充示意：设计按钮位置：它决定坦克、自火、坦歼、防空车或喷火坦克角色。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_5012_t: "坦克设计入门：先选类型（2/3）"
 MMG_gallery_5012_d: "设计按钮决定车辆角色：加农炮可转为坦歼，近距支援炮或榴弹炮可转为自行火炮，防空武器可转为自行防空炮，喷火器可转为喷火坦克。本条展示按钮位置与角色选择方法，不代表额外的成品坦克设计。\n补充示意：坦歼与自行火炮角色选择界面。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_5013_t: "坦克设计入门：先选类型（3/3）"
 MMG_gallery_5013_d: "设计按钮决定车辆角色：加农炮可转为坦歼，近距支援炮或榴弹炮可转为自行火炮，防空武器可转为自行防空炮，喷火器可转为喷火坦克。本条展示按钮位置与角色选择方法，不代表额外的成品坦克设计。\n补充示意：自行防空炮与喷火坦克角色选择界面。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_502_t: "亚洲战场初期战间期底盘"
 MMG_gallery_502_d: "该方案采用战间期中型坦克底盘，用于亚洲战场初期叠加突破。图示速度4千米/时、装甲厚度20、突破39.6、可靠性76.4%，生产花费6.44，适合作为较早投入量产的过渡型装甲方案。\n完整设计：亚洲战场初期战间期中型底盘完整设计。"
 MMG_gallery_503_t: "中型坦克：39年早期主力（1/2）"
 MMG_gallery_503_d: "39年中加农炮数据差，早期用39榴弹炮坦克或自火。装甲不超过5级，再多会额外耗钢；记得补引擎保4km/h。39维修连科技解锁的易维护改装是最值得上的省钱配件。\n完整设计：39年中型榴弹炮主力坦克完整设计。"
 MMG_gallery_5032_t: "中型坦克：39年早期主力（2/2）"
 MMG_gallery_5032_d: "39年中加农炮数据差，早期用39榴弹炮坦克或自火。装甲不超过5级，再多会额外耗钢；记得补引擎保4km/h。39维修连科技解锁的易维护改装是最值得上的省钱配件。\n补充示意：步兵坦克MIO的速度修正位置。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_504_t: "轻型自行火炮设计（1/2）"
 MMG_gallery_504_d: "本条展示两套轻型自行火炮设计。轻型自行火炮突破较低，但造价低、软攻高；第二套约8造价、50软攻，还可追加重机枪。中型自行火炮综合性能更强，但不在本条展示范围内。\n完整设计：轻型自行火炮方案一：低突破、低成本、高软攻。"
 MMG_gallery_5042_t: "轻型自行火炮设计（2/2）"
 MMG_gallery_5042_d: "本条展示两套轻型自行火炮设计。轻型自行火炮突破较低，但造价低、软攻高；第二套约8造价、50软攻，还可追加重机枪。中型自行火炮综合性能更强，但不在本条展示范围内。\n完整设计：轻型自行火炮方案二：约8造价、50软攻并可追加重机枪。"
 MMG_gallery_505_t: "自行反坦克炮（坦歼）（1/3）"
 MMG_gallery_505_d: "成品坦歼采用43年先进高速加农炮，具有很高的穿深与硬攻；中型底盘安装该武器时需要固定炮台。另两套加农炮方案当前仍是中型坦克角色，仅用于展示武器配置，使用时需通过设计按钮切换为坦歼。\n完整设计：先进高速加农炮坦歼完整设计：高穿深、高硬攻、固定炮台。"
 MMG_gallery_5052_t: "自行反坦克炮（坦歼）（2/3）"
 MMG_gallery_5052_d: "成品坦歼采用43年先进高速加农炮，具有很高的穿深与硬攻；中型底盘安装该武器时需要固定炮台。另两套加农炮方案当前仍是中型坦克角色，仅用于展示武器配置，使用时需通过设计按钮切换为坦歼。\n转换参考：改进型加农炮中型坦克参考；需点设计按钮切换为坦歼。图中显示的是转换前角色，不能直接当作坦歼成品；请按说明切换设计角色。"
 MMG_gallery_5053_t: "自行反坦克炮（坦歼）（3/3）"
 MMG_gallery_5053_d: "成品坦歼采用43年先进高速加农炮，具有很高的穿深与硬攻；中型底盘安装该武器时需要固定炮台。另两套加农炮方案当前仍是中型坦克角色，仅用于展示武器配置，使用时需通过设计按钮切换为坦歼。\n转换参考：改进高速加农炮中型坦克参考；当前角色仍是中型坦克。图中显示的是转换前角色，不能直接当作坦歼成品；请按说明切换设计角色。"
 MMG_gallery_506_t: "喷火坦克与装甲支援车（1/2）"
 MMG_gallery_506_d: "地面战科研解锁装甲支援车后，送的那辆13块8不要生产，生产自动退役的12块款并叠MIO偷工减料可压价。喷火坦克选中型喷火车与2级喷火器，油罐能提升师油料续航。\n完整设计：中型喷火坦克完整设计。"
 MMG_gallery_5062_t: "喷火坦克与装甲支援车（2/2）"
 MMG_gallery_5062_d: "地面战科研解锁装甲支援车后，送的那辆13块8不要生产，生产自动退役的12块款并叠MIO偷工减料可压价。喷火坦克选中型喷火车与2级喷火器，油罐能提升师油料续航。\n补充示意：装甲支援车生产列表：应选择自动退役的12造价型号。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_507_t: "机械化步战车与坦侦车（1/3）"
 MMG_gallery_507_d: "机械步战车是机械化步兵的前置：5造价、2可靠加125XP设计，机械步兵是步兵全面上位替代但耗钢耗胶，1级足够。坦侦车用于装甲侦察与假模板训练，要求便宜且可靠。\n完整设计：机械化步兵前置步战车设计：5造价、2可靠。"
 MMG_gallery_5072_t: "机械化步战车与坦侦车（2/3）"
 MMG_gallery_5072_d: "机械步战车是机械化步兵的前置：5造价、2可靠加125XP设计，机械步兵是步兵全面上位替代但耗钢耗胶，1级足够。坦侦车用于装甲侦察与假模板训练，要求便宜且可靠。\n完整设计：假模板训练用低成本坦侦车设计。"
 MMG_gallery_5073_t: "机械化步战车与坦侦车（3/3）"
 MMG_gallery_5073_d: "机械步战车是机械化步兵的前置：5造价、2可靠加125XP设计，机械步兵是步兵全面上位替代但耗钢耗胶，1级足够。坦侦车用于装甲侦察与假模板训练，要求便宜且可靠。\n完整设计：一般作战用装甲侦察车设计。"
 MMG_gallery_601_t: "多功能战斗机（主力推荐）（1/3）"
 MMG_gallery_601_d: "多功能的本质是挂近地支援任务的战斗机：把密接效率加成叠到145%到165%后，2挺重机枪多功能输出高于3挺重机枪纯战斗。只在有地面交战时起飞，易被地面防空击落。\n完整设计：火箭导轨解锁前的早期多功能设计。"
 MMG_gallery_6012_t: "多功能战斗机（主力推荐）（2/3）"
 MMG_gallery_6012_d: "多功能的本质是挂近地支援任务的战斗机：把密接效率加成叠到145%到165%后，2挺重机枪多功能输出高于3挺重机枪纯战斗。只在有地面交战时起飞，易被地面防空击落。\n完整设计：火箭导轨解锁前的多功能方案。"
 MMG_gallery_6013_t: "多功能战斗机（主力推荐）（3/3）"
 MMG_gallery_6013_d: "多功能的本质是挂近地支援任务的战斗机：把密接效率加成叠到145%到165%后，2挺重机枪多功能输出高于3挺重机枪纯战斗。只在有地面交战时起飞，易被地面防空击落。\n完整设计：中期至中后期火箭导轨多功能方案。"
 MMG_gallery_602_t: "纯种战斗机 / 防空截击"
 MMG_gallery_602_d: "纯种战斗机适合海峡与本土防空：装甲板与自闭油箱等于飞机血量，至少要一个额外油箱；两者不能同上是按情况取舍。对空武器优先级：2级机炮＞重机枪＞其他。\n完整设计：纯种战斗机完整设计：本土防空与截击。"
 MMG_gallery_603_t: "近地支援机（CAS）"
 MMG_gallery_603_d: "CAS在夺取制空权后执行轰炸，只需堆航程和输出，防御并不重要。空军学说、顾问与密接效率加成都会放大CAS输出。\n完整设计：近地支援机完整设计：夺取制空后堆航程与对地输出。"
 MMG_gallery_604_t: "配件与年份演变（1/5）"
 MMG_gallery_604_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。\n完整设计：同配件对照一：对地武器未放在首格。"
 MMG_gallery_6042_t: "配件与年份演变（2/5）"
 MMG_gallery_6042_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。\n完整设计：同配件对照二：对地武器放首格，可同时获得CAS与战斗机减价。"
 MMG_gallery_6043_t: "配件与年份演变（3/5）"
 MMG_gallery_6043_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。\n完整设计：1944年机体多功能完整设计。"
 MMG_gallery_6044_t: "配件与年份演变（4/5）"
 MMG_gallery_6044_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。\n完整设计：后期二级机炮完整设计。"
 MMG_gallery_6045_t: "配件与年份演变（5/5）"
 MMG_gallery_6045_d: "火箭导轨不减速，是中期多功能标配。相同配件下，把对地武器放在第一格可让CAS版多功能同时获得CAS与战斗机价格减免。44年机体最后一格只能放对地武器；后期2级机炮是最强对空武器。最后一页仅标出火箭导轨科技位置。\n补充示意：火箭导轨科技位置。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_701_t: "航母与主力舰队结构（1/2）"
 MMG_gallery_701_d: "36年航母塞满机库最常见。航母需要主力舰屏卫才能正常出击，航母数量等于或略少于战列/战巡数量；典型配置4航母加4战列舰加8轻巡加20驱逐。\n完整设计：36年满机库航母完整设计。"
 MMG_gallery_7012_t: "航母与主力舰队结构（2/2）"
 MMG_gallery_7012_d: "36年航母塞满机库最常见。航母需要主力舰屏卫才能正常出击，航母数量等于或略少于战列/战巡数量；典型配置4航母加4战列舰加8轻巡加20驱逐。\n完整设计：为航母承伤的肉盾战列舰完整设计。"
 MMG_gallery_702_t: "战列舰 / 战列巡洋舰（1/2）"
 MMG_gallery_702_d: "战列与战巡只差护甲：战列更厚更慢，战巡更快更脆。战列舰叠副炮较便宜，叠重炮更强但造价高；肉盾战列专门替航母扛伤害。\n完整设计：战列舰完整设计。"
 MMG_gallery_7022_t: "战列舰 / 战列巡洋舰（2/2）"
 MMG_gallery_7022_d: "战列与战巡只差护甲：战列更厚更慢，战巡更快更脆。战列舰叠副炮较便宜，叠重炮更强但造价高；肉盾战列专门替航母扛伤害。\n补充示意：战列舰与战巡舰的护甲差异。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_703_t: "轻巡与主力屏卫（1/2）"
 MMG_gallery_703_d: "侦查轻巡单独编队开避免交战巡逻，2到3条就够，负责找人而非打仗；主力轻巡用于融化敌方屏卫，可换先进火控。重巡也能打但玩法门槛较高。\n完整设计：避免交战的侦查轻巡完整设计。"
 MMG_gallery_7032_t: "轻巡与主力屏卫（2/2）"
 MMG_gallery_7032_d: "侦查轻巡单独编队开避免交战巡逻，2到3条就够，负责找人而非打仗；主力轻巡用于融化敌方屏卫，可换先进火控。重巡也能打但玩法门槛较高。\n完整设计：融化敌方屏卫的主力轻巡完整设计。"
 MMG_gallery_704_t: "驱逐舰（1/2）"
 MMG_gallery_704_d: "肉盾驱逐在前排承伤，维持屏卫效率，让主力舰与航母持续输出。鱼雷驱逐是绿水学派武器：轻巡融化屏卫后，由雷驱用大量鱼雷收割后排主力舰。\n完整设计：维持屏卫效率的肉盾驱逐舰完整设计。"
 MMG_gallery_7042_t: "驱逐舰（2/2）"
 MMG_gallery_7042_d: "肉盾驱逐在前排承伤，维持屏卫效率，让主力舰与航母持续输出。鱼雷驱逐是绿水学派武器：轻巡融化屏卫后，由雷驱用大量鱼雷收割后排主力舰。\n完整设计：绿水学派鱼雷驱逐舰完整设计。"
 MMG_gallery_705_t: "潜艇与反潜（1/2）"
 MMG_gallery_705_d: "本条展示的是反潜方案，不是潜艇设计。潜艇建议至少采用40年型船体、装满鱼雷并压低可见度，避开英吉利海峡等浅海，同时保证部署数量；反潜优先使用舰载鱼雷机与海军轰炸机，反潜驱逐舰次之。\n相关方案：反潜方案一：用于保护舰队和航线，不是潜艇设计。"
 MMG_gallery_7052_t: "潜艇与反潜（2/2）"
 MMG_gallery_7052_d: "本条展示的是反潜方案，不是潜艇设计。潜艇建议至少采用40年型船体、装满鱼雷并压低可见度，避开英吉利海峡等浅海，同时保证部署数量；反潜优先使用舰载鱼雷机与海军轰炸机，反潜驱逐舰次之。\n相关方案：反潜方案二；舰载鱼雷机或海军轰炸机优先于反潜驱逐。"
 MMG_gallery_706_t: "航母舰载机（1/2）"
 MMG_gallery_706_d: "舰载机只有舰攻（鱼雷/海军轰炸机）与舰爆（近距支援机）两类设计。舰攻能打主力舰与潜艇，鱼雷机上重机枪的多功能更强，舰爆较落后；航母可以只塞多功能舰攻。\n完整设计：多功能舰攻：鱼雷/海军轰炸机，可攻击主力舰与潜艇。"
 MMG_gallery_7062_t: "航母舰载机（2/2）"
 MMG_gallery_7062_d: "舰载机只有舰攻（鱼雷/海军轰炸机）与舰爆（近距支援机）两类设计。舰攻能打主力舰与潜艇，鱼雷机上重机枪的多功能更强，舰爆较落后；航母可以只塞多功能舰攻。\n完整设计：舰爆：近地支援机方案，整体弱于多功能舰攻。"
