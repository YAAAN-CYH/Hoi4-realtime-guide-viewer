 MMG_gallery_701_t: "航母与主力舰队结构（1/2）"
 MMG_gallery_701_d: "36年航母塞满机库最常见。航母需要主力舰屏卫才能正常出击，航母数量等于或略少于战列/战巡数量；典型配置4航母加4战列舰加8轻巡加20驱逐。\n完整设计：36年满机库航母完整设计。"
 MMG_gallery_7012_t: "航母与主力舰队结构（2/2）"
 MMG_gallery_7012_d: "36年航母塞满机库最常见。航母需要主力舰屏卫才能正常出击，航母数量等于或略少于战列/战巡数量；典型配置4航母加4战列舰加8轻巡加20驱逐。\n完整设计：为航母承伤的肉盾战列舰完整设计。"
 MMG_gallery_702_t: "战列舰 / 战列巡洋舰（1/2）"
 MMG_gallery_702_d: "战列与战巡只差护甲：战列更厚更慢，战巡更快更脆。战列舰叠副炮较便宜，叠重炮更强但造价高；肉盾战列专门替航母扛伤害。\n完整设计：战列舰完整设计。"
 MMG_gallery_7022_t: "战列舰 / 战列巡洋舰（2/2）"
 MMG_gallery_7022_d: "战列与战巡只差护甲：战列更厚更慢，战巡更快更脆。战列舰叠副炮较便宜，叠重炮更强但造价高；肉盾战列专门替航母扛伤害。\n补充示意：战列舰与战巡舰的护甲差异。此图只说明界面位置或差异，不代表另一套完整成品设计。"
 MMG_gallery_703_t: "轻巡与主力屏卫（1/2）"
 MMG_gallery_703_d: "侦查轻巡单独编队开避免交战巡逻，2到3条就够，负责找人而非打仗；主力轻巡用于融化敌方屏卫，可换先进火控。重巡也能打但玩法门槛较高。\n完整设计：避免交战的侦查轻巡完整设计。"
 MMG_gallery_7032_t: "轻巡与主力屏卫（2/2）"
 MMG_gallery_7032_d: "侦查轻巡单独编队开避免交战巡逻，2到3条就够，负责找人而非打仗；主力轻巡用于融化敌方屏卫，可换先进火控。重巡也能打但玩法门槛较高。\n完整设计：融化敌方屏卫的主力轻巡完整设计。"
 MMG_gallery_704_t: "驱逐舰（1/2）"
 MMG_gallery_704_d: "肉盾驱逐在前排承伤，维持屏卫效率，让主力舰与航母持续输出。鱼雷驱逐是绿水学派武器：轻巡融化屏卫后，由雷驱用大量鱼雷收割后排主力舰。\n完整设计：维持屏卫效率的肉盾驱逐舰完整设计。"
 MMG_gallery_7042_t: "驱逐舰（2/2）"
 MMG_gallery_7042_d: "肉盾驱逐在前排承伤，维持屏卫效率，让主力舰与航母持续输出。鱼雷驱逐是绿水学派武器：轻巡融化屏卫后，由雷驱用大量鱼雷收割后排主力舰。\n完整设计：绿水学派鱼雷驱逐舰完整设计。"
 MMG_gallery_705_t: "潜艇与反潜（1/2）"
 MMG_gallery_705_d: "本条展示的是反潜方案，不是潜艇设计。潜艇建议至少采用40年型船体、装满鱼雷并压低可见度，避开英吉利海峡等浅海，同时保证部署数量；反潜优先使用舰载鱼雷机与海军轰炸机，反潜驱逐舰次之。\n相关方案：反潜方案一：用于保护舰队和航线，不是潜艇设计。"
 MMG_gallery_7052_t: "潜艇与反潜（2/2）"
 MMG_gallery_7052_d: "本条展示的是反潜方案，不是潜艇设计。潜艇建议至少采用40年型船体、装满鱼雷并压低可见度，避开英吉利海峡等浅海，同时保证部署数量；反潜优先使用舰载鱼雷机与海军轰炸机，反潜驱逐舰次之。\n相关方案：反潜方案二；舰载鱼雷机或海军轰炸机优先于反潜驱逐。"
 MMG_gallery_706_t: "航母舰载机（1/2）"
 MMG_gallery_706_d: "舰载机只有舰攻（鱼雷/海军轰炸机）与舰爆（近距支援机）两类设计。舰攻能打主力舰与潜艇，鱼雷机上重机枪的多功能更强，舰爆较落后；航母可以只塞多功能舰攻。\n完整设计：多功能舰攻：鱼雷/海军轰炸机，可攻击主力舰与潜艇。"
 MMG_gallery_7062_t: "航母舰载机（2/2）"
 MMG_gallery_7062_d: "舰载机只有舰攻（鱼雷/海军轰炸机）与舰爆（近距支援机）两类设计。舰攻能打主力舰与潜艇，鱼雷机上重机枪的多功能更强，舰爆较落后；航母可以只塞多功能舰攻。\n完整设计：舰爆：近地支援机方案，整体弱于多功能舰攻。"
