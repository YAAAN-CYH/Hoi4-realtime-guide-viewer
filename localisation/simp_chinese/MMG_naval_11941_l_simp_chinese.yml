 MMG_naval11941_note_1: "解锁、航程与支援舰"
 MMG_naval11941_note_1_t: "解锁、航程与支援舰"
 MMG_naval11941_note_1_d: "部分船体、消声瓦、无氧推进器和超重组件来自海军专项科研或后续科技。导弹潜艇没有配套设计图。袖珍潜艇的500公里航程适合近海，能覆盖哪些海域取决于基地。支援船可延伸舰队航程，维修船可降低严重战损风险。两者使用现成型号直接建造。"
 MMG_naval11941_note_2: "载机量、出击与舰载机"
 MMG_naval11941_note_2_t: "载机量、出击与舰载机"
 MMG_naval11941_note_2_d: "单甲板护航航母基础搭载10架。合适的制造商采用高空间利用率设计后可达到20架。载机量与实战出击规模分开看，后者受对手舰队、出击效率等条件影响。潜水航母的舰载机可执行航母空中任务。哈巴库克可部署非舰载型飞机，具体机型看部署列表。"
 MMG_naval11941_index_t: "舰船设计 · 1.19.4.1"
 MMG_naval11941_index_d: "按舰种浏览46套不带制造商的设计。每套提供完整图、模块放大、属性与造价。解锁条件和实战数值随国家、科技及加成变化。"
