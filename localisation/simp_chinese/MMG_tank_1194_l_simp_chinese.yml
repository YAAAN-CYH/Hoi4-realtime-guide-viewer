 MMG_tank1194_index_t: "1.19.4 坦克设计 · 底盘目录"
 MMG_tank1194_index_d: "按底盘年代选择方案，每项可查看完整设计、模块放大和属性放大。数值来自全科技参考环境，实际属性会随已解锁科技、设计商及加成变化。无甲或0甲指不加装甲升级，并非装甲厚度为零。"
 MMG_tank1194_version_t: "1.19.4 · 版本与读图说明"
 MMG_tank1194_version_d: "炮兵与坦歼加成削弱，小加农炮的收益需重新比较；重机枪和轻机枪可用于补输出。自动装弹机另加2%软攻、2%对空，为百分比修正。\n全科技图例不等于该底盘解锁时即可完整照搬；后期武器、配件仍需对应科技。图中角色和数值优先，文字已据此校正。"
 MMG_tank1194_principles_t: "1.19.4 · 选型与投入"
 MMG_tank1194_principles_d: "作战中坦可优先比较不加装甲升级的成本；装甲优势必须结合敌方穿甲和整师属性判断。\n蹲坑与防守坦歼优先推土铲；各组末尾的高难防守坦歼在常规进攻中优先级低。\n先进轻坦方案暂缺；改进中坦0甲版、现代坦歼改型只有文字建议，不补造未提供的设计图或数值。"
