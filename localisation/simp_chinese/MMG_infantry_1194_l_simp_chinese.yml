 MMG_inf1194_index_t: "陆军编制 · 1.19.4"
 MMG_inf1194_index_d: "按战场与学说条件选择18套编制。每项有完整图、编制支援放大和属性造价放大；数值依赖图示装备、学说与精通，不能直接套用于未成型部队。"
 MMG_inf1194_note_1_t: "参考条件与默认学说"
 MMG_inf1194_note_1_d: "默认：人海突击；步兵卓越单兵；炮兵与战斗支援自行式支援；装甲自行反坦克；作战大规模强袭。\n数值按推荐学说与满精通环境展示。最后三套须另换学说；装备不足时优先按本国科技与产能调整。"
 MMG_inf1194_note_3_label: "1.19.4 · 减宽与后勤"
 MMG_inf1194_note_2_t: "1.19.4 · 突破与装甲单位"
 MMG_inf1194_note_2_d: "坦歼、自行防空、自行火炮的营级突破惩罚统一为-75%；团支坦歼与团支自行防空为-90%。\n坦歼与自火另有+25%防御，团支坦歼防御惩罚为-33%。突破仍需按整师核对，不能将坦歼当作坦克的无条件上位替代。"
 MMG_inf1194_note_2_label: "1.19.4 · 突破与装甲单位"
 MMG_inf1194_note_4_label: "1.19.4 · 团规模与成长"
 MMG_inf1194_note_3_t: "1.19.4 · 减宽与后勤"
 MMG_inf1194_note_3_d: "人海步兵里程碑减0.2步兵宽度；大规模部队的相关奖励也减0.2。\n集中火力的采用奖励给线列火炮+10组织；机动侦察与突击让后勤再减5%补给。卓越单兵中后勤对摩托/机步的HP加成降为2.5；人海作战里程碑另有-15%补给。"
 MMG_inf1194_note_4_t: "1.19.4 · 团规模与成长"
 MMG_inf1194_note_4_d: "人海步兵里程碑不再给团规模+1；这一奖励已移到炮兵与战斗支援里程碑，后者另给+2%增援率。\n自火科技的软攻成长收缩；坦歼硬攻科技成长为每项5%，团支为2.5%。装甲HP随可靠性缩放，营级与团支的基础HP也不同。"
 MMG_inf1194_note_51_t: "工兵与喷火支援"
 MMG_inf1194_note_51_d: "工兵、侦察与喷火提供重要地形修正，按战场选择。突击工兵、装甲工兵等改型要有对应科技与装备。\n中型喷火是常用参考；按足额配装检查效果，不把旧版本“无装备也生效”的现象当作当前保证。装甲支援车已纳入中坦MIO适用类别。"
 MMG_inf1194_note_52_t: "侦察连的分工"
 MMG_inf1194_note_52_d: "游骑兵侦察重在地形修正，并有特种学说解锁要求；轻坦侦察可给装甲及衍生车辆营+10%硬攻。\n装甲汽车侦察是另一类型：纵深战斗首项奖励现可让它给徒步步兵+5%软攻与防御，不能与轻坦侦察混称。"
 MMG_inf1194_note_53_t: "后勤与野战医院"
 MMG_inf1194_note_53_d: "后勤降低补给与油耗；医院降低经验损失并为步兵类营提供10%HP，不能当作整师所有兵种一律加10%。\n选卓越单兵时，其后勤对摩托与机步的额外HP现为2.5；机动侦察与突击另增强后勤补给效果。回收伤员比例仍有上限。"
 MMG_inf1194_note_54_t: "火力支援与团支"
 MMG_inf1194_note_54_d: "普通支援炮是低成本早期补充，防空按敌方空军与穿甲需求选择。团支通常需同团至少3个作战营。\n团步兵炮、重武器、防空和装甲团支各有用途；团支坦歼的突破为-90%修正，不能拿旧图中的高输出推出它全面优于坦克。"
 MMG_inf1194_note_55_t: "维修与可靠性的取舍"
 MMG_inf1194_note_55_d: "维修连占用支援位并消耗装备，按损耗、缴获与工业条件取舍。装甲HP随可靠性缩放，不能再把维修一概判为无用。\n易维护改装现为造价-5%、可靠性+7.5%、设计20XP；装备缴获计算已修正并按最高100%计算。"
 MMG_inf1194_note_56_t: "占领法案与顺从"
 MMG_inf1194_note_56_d: "占领收益取决于顺从度、驻军装备和抵抗状况。民间监督可用于积累顺从；民主国家可比较地方自治。\n共产国家的解放工人有工厂与资源收益，但会牺牲顺从增长；不要只看即时收益，需结合当地抵抗和驻军负担调整。"
 MMG_inf1194_note_61_t: "20XP · 学院精神"
 MMG_inf1194_note_61_d: "大胆进攻适合希望培养进攻型将领的路线：将领升级有50%几率额外获得+1进攻。\n这是升级倾向，不是直接给所有师增加攻击；是否可选还受军官学院与DLC条件限制。"
 MMG_inf1194_note_62_t: "35XP · 编制与工程"
 MMG_inf1194_note_62_d: "人海专用刺刀之锋可降低步兵、摩托、机步等编制修改的经验花费，并增加步兵战斗经验获取。\n工程兵团降低工兵编制花费、提高堑壕挖掘速度。按是否正在集中改编制、修筑防线选择。"
 MMG_inf1194_note_64_t: "35XP · 政体限定精神"
 MMG_inf1194_note_64_d: "国家服务军队：法西斯，进攻战争稳定修正+10%。\n解除指挥权：民主，陆军经验获取+25%、陆军顾问花费-50%。\n忠于意识形态：共产，每周+500人力并降低包围惩罚。先核对本国政体和可用选项。"
 MMG_inf1194_note_63_t: "50XP · 师级指挥精神"
 MMG_inf1194_note_63_d: "战术储备：人海，+10%HP。专注后勤：决战，补给-10%，海空油耗-10%；不等于陆军油耗也减10%。\n静态战争适合堑壕防守，灵活组织侧重移动与组织保持；两者有学说条件，按可用选项选择。"
