 MMG_inf1194_spirit_menu_t: "陆军精神 · 按条件选择"
 MMG_inf1194_spirit_menu_d: "按20、35、50XP分类查看常用精神。政体、主学说、子学说、军官学院和DLC会影响可用项；不能把几个互斥精神的收益同时算入。"
 MMG_inf1194_land_101_label: "主学说：人海 / 决战 / 机动取舍"
 MMG_inf1194_land_102_label: "步兵：卓越单兵与改学说方案"
 MMG_inf1194_land_103_label: "炮兵：自行支援 / 机侦 / 集火"
 MMG_inf1194_land_104_label: "装甲：坦歼与坦克的角色"
 MMG_inf1194_land_105_label: "作战：大规模强袭 / 渗透"
 MMG_inf1194_land_100_t: "陆军学说 · 1.19.4参考"
 MMG_inf1194_land_100_d: "按主学说、步兵、炮兵与战斗支援、装甲、作战五条分别选择。多数编制采用人海与卓越单兵，但最后三套另有切换要求。\n学说与精通会改变宽度、组织和后勤收益；先核对编制条件，再比较路线。"
 MMG_inf1194_land_101_t: "主学说：人海 / 决战 / 机动取舍"
 MMG_inf1194_land_101_d: "常用参考为人海突击或决战计划。人海步兵里程碑现减0.2步兵宽度；与大规模部队的减宽可叠加。\n机动作战装甲里程碑已给全军+15%突破，装甲路线值得重新比较，不再沿用“无人问津”的旧判断。"
 MMG_inf1194_land_102_t: "步兵：卓越单兵与改学说方案"
 MMG_inf1194_land_102_d: "多数图例使用卓越单兵；其后勤对摩托、机步的额外HP已由5降为2.5。\n超宽步兵和大宽步炮另改大规模部队，九骑八炮另改骑乘步兵；不要把换学说前的组织与宽度继续套用。"
 MMG_inf1194_land_103_t: "炮兵：自行支援 / 机侦 / 集火"
 MMG_inf1194_land_103_d: "自行式支援适合相应车辆体系；机动侦察与突击能让后勤再减5%补给。\n集中火力采用奖励的线列火炮组织现为+10；步炮与骑炮切换此线后，应连同宽度、组织和团支一起核对。自火加成也已收缩，不能无条件视为火炮上位替代。"
 MMG_inf1194_land_104_t: "装甲：坦歼与坦克的角色"
 MMG_inf1194_land_104_d: "坦歼侧重硬攻与穿甲，坦克仍有补突破的价值。自行反坦克部队与机动防御按主力车辆选择。\n1.19.4区分营级-75%突破和团支-90%；高硬攻不代表适合所有进攻，堑壕防守与突破攻坚应分开看。"
 MMG_inf1194_land_105_t: "作战：大规模强袭 / 渗透"
 MMG_inf1194_land_105_d: "大规模强袭与渗透战术是常用参考路线，按主力打法和可用精通选择。\n主学说人海的作战里程碑另有-15%补给，最低训练等级修正由-5%变为-10%，旧+5%堑壕速度已移除；不要与子学说名称混为一谈。"
