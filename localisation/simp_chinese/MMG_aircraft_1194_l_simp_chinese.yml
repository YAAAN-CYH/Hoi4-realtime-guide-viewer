 MMG_air1194_index_t: "飞机设计 · 1.19.4"
 MMG_air1194_index_d: "按机身年代选择36套方案。每套可看完整设计、武器配件放大与属性造价放大。年份指机身，配件仍需对应研究；数值随任务、国家和学说变化。"
 MMG_air1194_note_2_label: "多功能、任务与效率"
 MMG_air1194_note_2_t: "多功能、任务与效率"
 MMG_air1194_note_2_d: "“多功能”是用途，不是独立机型。对空武器配炸弹、火箭或鱼雷，可兼顾空战和支援；实际分类取决于首槽主武器。\n战场支援等学说与持续打击精神可提高密接效率。145%至150%是带条件的参考值；效率影响空战参数，不等于对地攻击按同比例增加。按当前任务提示核对。"
 MMG_air1194_note_3_label: "配件数量与科技条件"
 MMG_air1194_note_3_t: "配件数量与科技条件"
 MMG_air1194_note_3_d: "“2组四联机枪”表示两个模块、共8挺；双联机炮同理。配件放大页保留武器和引擎配件的原始槽位，空槽不需要补装。\n机炮I是1939科技，反坦克机炮II由1940反坦克科技解锁。喷气、轴流引擎、现代与超音速机身还要对应研究或特殊项目；机身年份不是全套科技年份。"
 MMG_air1194_note_4_label: "航程、防护与舰载任务"
 MMG_air1194_note_4_t: "航程、防护与舰载任务"
 MMG_air1194_note_4_d: "额外油箱与可抛弃油箱用于扩展航程，装甲板与密封油箱用于补充空防；根据任务范围权衡重量、推力和造价。\n舰载设计优先完成舰队所需任务；陆基部署仍需足够航程。穿甲炸弹与鱼雷的对海效果、俯冲减速板的效果，需在海军打击等对应任务下查看，不能只读默认面板。"
 MMG_air1194_note_5_label: "侦察、情报与减价"
 MMG_air1194_note_5_t: "侦察、情报与减价"
 MMG_air1194_note_5_d: "侦察机可提供陆军情报；原攻略的20%情报与约6%地面攻防优势，以对手侦察、情报差和上限等条件为前提，并非每架飞机固定叠加。\n现代多功能可把火箭导轨放首槽，取得CAS分类并满足相应生产减价条件。约12.4%与10%只是特定国策环境的例子；按本国实际造价检查。"
 MMG_air1194_note_6_label: "机型取舍与设计预设"
 MMG_air1194_note_6_t: "机型取舍与设计预设"
 MMG_air1194_note_6_d: "战间期机身防护不足，不列入本次36套参考。专职CAS和战略轰炸机要有空中掩护，重战、舰载机和战略轰炸按任务与产能选择；低科技战略轰炸不宜盲目投入。\n设计预设可通过设计器的“从剪贴板导入预设”按钮导入。导入后逐项检查机型、武器配件与本国科技，再安排生产。"
 MMG_air1194_rules_t: "任务、配件与科技说明"
 MMG_air1194_rules_d: "先确认武器模块数量、机型分类、任务效果和科技条件，再比较造价与性能。"
 MMG_air1194_doctrine_301_label: "战场支援与密接效率"
 MMG_air1194_doctrine_302_label: "战斗机与CAS子学说"
 MMG_air1194_doctrine_303_label: "重战与战略轰炸的取舍"
 MMG_air1194_doctrine_300_t: "空军学说 · 任务导向"
 MMG_air1194_doctrine_300_d: "本攻略常用战场支援与多功能/CAS体系。制空、重战与战略轰炸有不同任务，不把“多数情况下优先CAS”当作其他飞机永远无用。\n结合主力机型选择子学说与精通；可转到飞机设计查看36套完整配置。"
 MMG_air1194_doctrine_301_t: "战场支援与密接效率"
 MMG_air1194_doctrine_301_d: "战场支援适合以CAS和多功能机为主的体系，配合相关精神提高密接效率。\n效率提高不等于对地攻击同比增加。飞机能否提供地面支援、参与空战，还取决于可用任务、地面战斗与战区覆盖。"
 MMG_air1194_doctrine_302_t: "战斗机与CAS子学说"
 MMG_air1194_doctrine_302_d: "按实际任务选择战斗机或CAS相关子学说。首槽主武器决定设计分类，多功能用途并不保证自动同时获得所有类别加成。\n改主武器、学说或国策后，重新检查任务属性与生产造价；不把某国的效率和减价比例作为通用值。"
 MMG_air1194_doctrine_303_t: "重战与战略轰炸的取舍"
 MMG_air1194_doctrine_303_d: "中型机身可用于侦察或重战，大型机身可承担战略轰炸。本次设计保留这些用途，并不要求所有国家都投入对应工业与学说。\n有明确远程任务和产能时再发展；优先保障空中掩护，并核对发动机、电子和瞄准配件的科技条件。"
